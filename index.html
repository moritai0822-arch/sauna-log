// ===== おすすめ（相性予測・仲間の高評価・好み診断） =====
const MOODS = [
  { key: "totonou", label: "🌿 とにかく整いたい",    cats: ["sauna", "mizuburo", "totonoi"] },
  { key: "empty",   label: "👥 空いている所",        cats: ["konzatsu"] },
  { key: "cheap",   label: "💴 安く済ませたい",      cats: ["price"] },
  { key: "bath",    label: "♨️ お風呂も楽しみたい",  cats: ["furo"] },
  { key: "clean",   label: "🧼 清潔さ重視",          cats: ["manner"] },
];

function personKeyOf(s, currentUser) {
  if (s.user_id === currentUser.id || s.author === currentUser.name) return "me";
  if (s.user_id) return s.user_id;
  return s.author ? "n:" + s.author : null;
}

function pearson(xs, ys) {
  const n = xs.length; if (n < 3) return null;
  const mx = xs.reduce((a, b) => a + b, 0) / n, my = ys.reduce((a, b) => a + b, 0) / n;
  let sxy = 0, sxx = 0, syy = 0;
  for (let i = 0; i < n; i++) { sxy += (xs[i] - mx) * (ys[i] - my); sxx += (xs[i] - mx) ** 2; syy += (ys[i] - my) ** 2; }
  if (sxx === 0 || syy === 0) return null;
  return sxy / Math.sqrt(sxx * syy);
}

function distanceKm(lat1, lng1, lat2, lng2) {
  const rad = x => x * Math.PI / 180, R = 6371;
  const dLat = rad(lat2 - lat1), dLng = rad(lng2 - lng1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function buildRecoModel(saunas, currentUser) {
  const MIN_OVERLAP = 2;
  const groups = groupByFacility(saunas);
  const gMap = {}; groups.forEach(g => { gMap[g.name.trim()] = g; });
  const R = {}, names = {};
  saunas.forEach(s => {
    const p = personKeyOf(s, currentUser); if (!p) return;
    const f = s.name.trim();
    if (!R[p]) R[p] = {};
    if (!R[p][f]) R[p][f] = { n: 0, cat: {} };
    const r = R[p][f]; r.n++;
    CATEGORIES.forEach(c => { r.cat[c.key] = (r.cat[c.key] || 0) + (s.scores[c.key] || 0); });
    if (p !== "me") names[p] = s.author || "匿名";
  });
  Object.values(R).forEach(pf => Object.values(pf).forEach(r => {
    CATEGORIES.forEach(c => { r.cat[c.key] = r.cat[c.key] / r.n; });
    r.overall = avg(r.cat);
  }));
  const me = R.me || {};

  // 相性（点の付け方の近さ）
  const sims = [];
  Object.keys(R).forEach(p => {
    if (p === "me") return;
    const common = Object.keys(R[p]).filter(f => me[f]);
    if (common.length < MIN_OVERLAP) return;
    const d = common.reduce((a, f) => a + Math.abs(me[f].overall - R[p][f].overall), 0) / common.length;
    sims.push({ key: p, name: names[p], sim: Math.max(0, 1 - d / 2.5), n: common.length });
  });
  sims.sort((a, b) => b.sim - a.sim);
  const simOf = {}; sims.forEach(x => { simOf[x.key] = x; });

  const myFacs = Object.keys(me);
  const myCat = {}; CATEGORIES.forEach(c => { myCat[c.key] = myFacs.length ? myFacs.reduce((a, f) => a + me[f].cat[c.key], 0) / myFacs.length : 0; });
  const myMean = myFacs.length ? avg(myCat) : 0;

  // 未訪問施設の予測
  const items = [];
  Object.keys(gMap).forEach(f => {
    if (me[f]) return;
    const raters = Object.keys(R).filter(p => p !== "me" && R[p][f]);
    if (!raters.length) return;
    const withSim = raters.filter(p => simOf[p] && simOf[p].sim > 0);
    const basis = withSim.length ? "match" : "avg";
    const ws = (basis === "match" ? withSim : raters).map(p => ({ p, w: basis === "match" ? Math.pow(simOf[p].sim, 2) : 1 }));
    const tw = ws.reduce((a, x) => a + x.w, 0);
    // 相性が低い人の評価は鵜呑みにせず、自分の平均点に寄せる（相性が高いほど評価をそのまま採用）
    const K = (basis === "match" && myFacs.length) ? 0.15 : 0;
    const cat = {};
    CATEGORIES.forEach(c => { cat[c.key] = (ws.reduce((a, x) => a + x.w * R[x.p][f].cat[c.key], 0) + K * myCat[c.key]) / (tw + K); });
    const overall = (ws.reduce((a, x) => a + x.w * R[x.p][f].overall, 0) + K * myMean) / (tw + K);
    const reasons = [...ws].sort((a, b) => b.w - a.w).slice(0, 3).map(x => ({ name: names[x.p], score: R[x.p][f].overall, sim: simOf[x.p] ? simOf[x.p].sim : null }));
    const raterList = raters.map(p => ({ name: names[p], score: R[p][f].overall })).sort((a, b) => b.score - a.score);
    items.push({ name: f, group: gMap[f], overall, cat, basis, reasons, raterList, nRaters: raters.length, nMatch: withSim.length, tw });
  });

  // 好みプロファイル
  const othersCat = {}; let othersN = 0;
  CATEGORIES.forEach(c => { othersCat[c.key] = 0; });
  myFacs.forEach(f => {
    const others = Object.keys(R).filter(p => p !== "me" && R[p][f]);
    if (!others.length) return;
    othersN++;
    CATEGORIES.forEach(c => { othersCat[c.key] += others.reduce((a, p) => a + R[p][f].cat[c.key], 0) / others.length; });
  });
  CATEGORIES.forEach(c => { othersCat[c.key] = othersN ? othersCat[c.key] / othersN : 0; });
  let corr = null;
  if (myFacs.length >= 5) {
    corr = CATEGORIES.map(c => {
      const xs = myFacs.map(f => me[f].cat[c.key]);
      const ys = myFacs.map(f => avg(Object.fromEntries(CATEGORIES.filter(k => k.key !== c.key).map(k => [k.key, me[f].cat[k.key]]))));
      return { key: c.key, r: pearson(xs, ys) };
    }).filter(x => x.r != null).sort((a, b) => b.r - a.r);
  }
  return { items, sims, myCount: myFacs.length, myCat, othersCat: othersN ? othersCat : null, corr };
}

function RadarChart({ series }) {
  const cx = 160, cy = 150, Rr = 92, n = CATEGORIES.length;
  const pt = (i, v) => { const a = -Math.PI / 2 + (2 * Math.PI * i) / n; return [cx + Math.cos(a) * Rr * (v / 5), cy + Math.sin(a) * Rr * (v / 5)]; };
  return (
    <svg viewBox="0 0 320 300" style={{ width: "100%", maxWidth: 340, display: "block", margin: "0 auto" }}>
      {[1, 2, 3, 4, 5].map(l => (
        <polygon key={l} points={CATEGORIES.map((c, i) => pt(i, l).join(",")).join(" ")} fill="none" stroke="#2e2e36" strokeWidth="1"/>
      ))}
      {CATEGORIES.map((c, i) => { const [x, y] = pt(i, 5); return <line key={c.key} x1={cx} y1={cy} x2={x} y2={y} stroke="#2e2e36" strokeWidth="1"/>; })}
      {series.map((s, si) => (
        <polygon key={si} points={CATEGORIES.map((c, i) => pt(i, s.values[c.key] || 0).join(",")).join(" ")}
          fill={s.color + (s.dash ? "00" : "33")} stroke={s.color} strokeWidth="2" strokeDasharray={s.dash ? "5 4" : undefined}/>
      ))}
      {CATEGORIES.map((c, i) => {
        const a = -Math.PI / 2 + (2 * Math.PI * i) / n;
        const x = cx + Math.cos(a) * (Rr + 20), y = cy + Math.sin(a) * (Rr + 20);
        const anchor = Math.cos(a) > 0.3 ? "start" : Math.cos(a) < -0.3 ? "end" : "middle";
        return <text key={c.key} x={x} y={y} fill="#8888a0" fontSize="10" textAnchor={anchor} dominantBaseline="middle">{c.icon}{{ sauna: "サウナ", mizuburo: "水風呂", totonoi: "整い", konzatsu: "混雑", furo: "風呂", manner: "衛生", price: "値段" }[c.key] || c.label}</text>;
      })}
    </svg>
  );
}

          <div style={{ background: "#1a2a3a", border: "1px solid #2a4a6a", borderRadius: 12, padding: "10px 12px", marginBottom: 10, fontSize: 12, color: "#9ac8d8", lineHeight: 1.6 }}>
            まだ行っていない施設を、<b>あなたと点の付け方が近い仲間の評価</b>から予測しています。
            {needMore

              : <div style={{ marginTop: 4, color: "#8ab0c0" }}>あなたの評価：{model.myCount}施設 ／ 相性が出せる仲間：{model.sims.length}人</div>}
          </div>

          <div style={{ color: "#8888a0", fontSize: 11, fontWeight: 600, marginBottom: 6 }}>今の気分（複数選択OK）</div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 10 }}>
            {MOODS.map(m => <button key={m.key} style={chip(moods.includes(m.key))} onClick={() => toggleMood(m.key)}>{m.label}</button>)}
          </div>

          <div style={{ display: "flex", flexWrap: "wrap", gap: 6, alignItems: "center", marginBottom: 8 }}>
            <button style={chip(typeFilter === "all")} onClick={() => setTypeFilter("all")}>すべて</button>
            {FACILITY_TYPES.map(t => <button key={t.key} style={chip(typeFilter === t.key)} onClick={() => setTypeFilter(t.key)}>{t.icon} {t.label}</button>)}
          </div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6, alignItems: "center", marginBottom: 12 }}>
            {!loc
              ? <button style={chip(false)} onClick={getLoc}>📍 現在地から探す</button>
              : <>
                  <select value={maxKm} onChange={e => setMaxKm(Number(e.target.value))}
                    style={{ background: "#26262c", border: "1px solid #35353e", borderRadius: 20, padding: "5px 10px", color: maxKm ? "#4AB8D4" : "#8888a0", fontSize: 16, outline: "none" }}>
                    <option value={0}>距離：指定なし</option>
                    <option value={10}>10km以内</option>
                    <option value={30}>30km以内</option>
                    <option value={100}>100km以内</option>
                  </select>
                  <button style={chip(sortMode === "near")} onClick={() => setSortMode(s => s === "near" ? "score" : "near")}>{sortMode === "near" ? "近い順" : "スコア順"}</button>
                </>}
            {locMsg && <span style={{ fontSize: 11, color: "#8888a0" }}>{locMsg}</span>}
          </div>
          {loc && maxKm > 0 && <div style={{ fontSize: 10, color: "#5a5a6a", marginBottom: 8 }}>※ 位置情報（地図の座標）が未取得の施設は、距離の絞り込みでは表示されません</div>}

          {list.length === 0
            ? <div style={{ textAlign: "center", padding: "40px 16px", color: "#5a5a6a", fontSize: 13, lineHeight: 1.7 }}>
                <div style={{ fontSize: 36, marginBottom: 8 }}>🔍</div>
                条件に合う未訪問の施設がありません
              </div>
            : <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {list.map(it => (
                  <div key={it.name} style={{ background: "#26262c", border: "1px solid #2e2e36", borderRadius: 14, padding: "12px 12px 10px" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 2, flexShrink: 0 }}>
                        <ScoreCircle value={it.score} size={52}/>
                        <div style={{ fontSize: 9, color: "#8888a0", whiteSpace: "nowrap" }}>{moodKeys.length ? "気分" : ""}{it.basis === "match" ? "相性予測" : "全体平均"}</div>
                      </div>
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap", marginBottom: 3 }}>
                          <div className="rank-name" style={{ maxWidth: "100%" }}>{it.name}</div>
                          <FacilityTypeBadge typeKey={it.group.facility_type}/>
                        </div>
                        <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap", marginBottom: 3 }}>
                          {it.group.prefecture && <span style={{ background: "#1a2a3a", border: "1px solid #2a4a6a", borderRadius: 20, padding: "1px 8px", fontSize: 10, color: "#4AB8D4", fontWeight: 600 }}>📍 {it.group.prefecture}</span>}
                          {it.dist != null && <span style={{ color: "#8888a0", fontSize: 10 }}>現在地から {it.dist < 10 ? it.dist.toFixed(1) : Math.round(it.dist)}km</span>}
                          {confBadge(it)}
                        </div>
                        <div className="cat-scores">
                          {CATEGORIES.map(c => (
                            <span key={c.key} className="cat-score-item" style={{ color: moodKeys.includes(c.key) ? "#C8956A" : "#5a5a6a", fontWeight: moodKeys.includes(c.key) ? 700 : 400 }}>{c.icon}{it.cat[c.key].toFixed(1)}</span>
                          ))}
                        </div>
                      </div>
                    </div>
                    <div style={{ marginTop: 8, background: "#1a1a22", borderRadius: 8, padding: "6px 10px", fontSize: 11, color: "#9a9ab8", lineHeight: 1.6 }}>
                      {it.basis === "match"
                        ? <>根拠：{it.reasons.map((r, i) => <span key={i}>{i > 0 && "・"}{r.name}さん（相性{Math.round(r.sim * 100)}%）{r.score.toFixed(1)}</span>)}</>
                        : <>{it.nRaters}人の評価の平均です。まだ相性を出せる仲間がいないため目安です。</>}
                    </div>
                    <button onClick={() => openGMap(it.group)} style={{ marginTop: 8, width: "100%", padding: "7px", background: "#1a2a3a", border: "1px solid #2a4a6a", borderRadius: 8, color: "#4AB8D4", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>📍 Googleマップで開く</button>
                  </div>
                ))}
              </div>}
        </div>
      )}

      {/* ===== 仲間の高評価 ===== */}
      {sub === "peer" && (
        <div>
          <div style={{ color: "#8888a0", fontSize: 12, marginBottom: 10, lineHeight: 1.6 }}>あなたがまだ評価していない施設のうち、仲間の誰かが <b>★4.0以上</b> をつけているものです。</div>
          {peerList.length === 0
            ? <div style={{ textAlign: "center", padding: "40px 16px", color: "#5a5a6a", fontSize: 13 }}><div style={{ fontSize: 36, marginBottom: 8 }}>👥</div>今のところ該当する施設はありません</div>
            : <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {peerList.map(it => (
                  <div key={it.name} style={{ background: "#26262c", border: "1px solid #2e2e36", borderRadius: 14, padding: "12px" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap", marginBottom: 6 }}>
                      <div className="rank-name" style={{ maxWidth: "100%" }}>{it.name}</div>
                      <FacilityTypeBadge typeKey={it.group.facility_type}/>
                      {it.group.prefecture && <span style={{ background: "#1a2a3a", border: "1px solid #2a4a6a", borderRadius: 20, padding: "1px 8px", fontSize: 10, color: "#4AB8D4", fontWeight: 600 }}>📍 {it.group.prefecture}</span>}
                    </div>
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 8 }}>
                      {it.raterList.map((r, i) => (
                        <span key={i} style={{ background: r.score >= 4 ? "#1a2a3a" : "#1a1a22", border: "1px solid " + (r.score >= 4 ? "#2a4a6a" : "#2e2e36"), borderRadius: 20, padding: "3px 10px", fontSize: 12, color: r.score >= 4 ? "#4AB8D4" : "#8888a0", fontWeight: 600 }}>
                          👤 {r.name} {r.score.toFixed(1)}
                        </span>
                      ))}
                    </div>
                    <button onClick={() => openGMap(it.group)} style={{ width: "100%", padding: "7px", background: "#1a2a3a", border: "1px solid #2a4a6a", borderRadius: 8, color: "#4AB8D4", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>📍 Googleマップで開く</button>
                  </div>
                ))}
              </div>}
        </div>
      )}

      {/* ===== 好み診断 ===== */}
      {sub === "profile" && (
        <div>
          {model.myCount === 0
            ? <div style={{ textAlign: "center", padding: "40px 16px", color: "#5a5a6a", fontSize: 13, lineHeight: 1.7 }}><div style={{ fontSize: 36, marginBottom: 8 }}>🧬</div>評価を投稿すると、あなたの好みの傾向がここに出ます</div>
            : <>
                <div style={{ background: "#26262c", border: "1px solid #2e2e36", borderRadius: 14, padding: "12px 8px 10px", marginBottom: 12 }}>
                  <div style={{ color: "#E8EDF2", fontWeight: 700, fontSize: 14, padding: "0 6px 4px" }}>あなたの評価の傾向（{model.myCount}施設）</div>
                  <RadarChart series={[
                    ...(model.othersCat ? [{ values: model.othersCat, color: "#C8956A", dash: true }] : []),
                    { values: model.myCat, color: "#4AB8D4" },
                  ]}/>
                  <div style={{ display: "flex", justifyContent: "center", gap: 14, fontSize: 11, color: "#8888a0", marginTop: 2 }}>
                    <span><span style={{ color: "#4AB8D4" }}>━</span> あなた</span>
                    {model.othersCat && <span><span style={{ color: "#C8956A" }}>┅</span> 仲間の平均（同じ施設）</span>}
                  </div>
                  {model.othersCat && (() => {
                    const diffs = CATEGORIES.map(c => ({ c, d: model.myCat[c.key] - model.othersCat[c.key] })).sort((a, b) => b.d - a.d);
                    const hi = diffs[0], lo = diffs[diffs.length - 1];
                    return (
                      <div style={{ margin: "10px 6px 2px", fontSize: 12, color: "#9a9ab8", lineHeight: 1.7 }}>
                        {hi.d > 0.2 && <div>👍 仲間より<b style={{ color: "#E8EDF2" }}>{hi.c.icon}{hi.c.label}</b>に甘め（+{hi.d.toFixed(1)}）</div>}
                        {lo.d < -0.2 && <div>🧐 仲間より<b style={{ color: "#E8EDF2" }}>{lo.c.icon}{lo.c.label}</b>に厳しめ（{lo.d.toFixed(1)}）</div>}
                        {hi.d <= 0.2 && lo.d >= -0.2 && <div>仲間とほぼ同じ感覚で評価しています</div>}
                      </div>
                    );
                  })()}
                </div>

                <div style={{ background: "#26262c", border: "1px solid #2e2e36", borderRadius: 14, padding: "12px", marginBottom: 12 }}>
                  <div style={{ color: "#E8EDF2", fontWeight: 700, fontSize: 14, marginBottom: 6 }}>総合評価を左右する項目</div>
                  {model.corr && model.corr.length > 0
                    ? <>
                        <div style={{ color: "#8888a0", fontSize: 11, lineHeight: 1.6, marginBottom: 8 }}>総合評価が高い施設ほど、この項目も高くなる傾向があります。</div>
                        {model.corr.slice(0, 3).filter(x => x.r > 0.2).map(x => {
                          const c = CATEGORIES.find(k => k.key === x.key);
                          return (
                            <div key={x.key} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
                              <span style={{ width: 96, fontSize: 12, color: "#E8EDF2", flexShrink: 0 }}>{c.icon} {c.label}</span>
                              <div style={{ flex: 1, height: 8, background: "#1a1a22", borderRadius: 4, overflow: "hidden" }}>
                                <div style={{ width: Math.round(x.r * 100) + "%", height: "100%", background: "linear-gradient(90deg,#4AB8D4,#2e8fa8)" }}/>
                              </div>
                            </div>
                          );
                        })}
                      </>
                    : <div style={{ color: "#5a5a6a", fontSize: 12, lineHeight: 1.6 }}>評価が5施設以上たまると、あなたの評価を左右する項目が分かります（今：{model.myCount}施設）</div>}
                </div>

                <div style={{ background: "#26262c", border: "1px solid #2e2e36", borderRadius: 14, padding: "12px" }}>
                  <div style={{ color: "#E8EDF2", fontWeight: 700, fontSize: 14, marginBottom: 6 }}>あなたと相性の良い仲間</div>
                  {model.sims.length === 0
                    ? <div style={{ color: "#5a5a6a", fontSize: 12, lineHeight: 1.6 }}>同じ施設を2つ以上評価した仲間がまだいません。評価する施設が増えると出てきます。</div>
                    : model.sims.map(s => (
                        <div key={s.key} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
                          <span style={{ width: 84, fontSize: 12, color: "#E8EDF2", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", flexShrink: 0 }}>👤 {s.name}</span>
                          <div style={{ flex: 1, height: 8, background: "#1a1a22", borderRadius: 4, overflow: "hidden" }}>
                            <div style={{ width: Math.round(s.sim * 100) + "%", height: "100%", background: s.sim >= 0.7 ? "#5adf9a" : s.sim >= 0.5 ? "#d9b46a" : "#e05858" }}/>
                          </div>
                          <span style={{ width: 84, fontSize: 11, color: "#8888a0", textAlign: "right", flexShrink: 0, whiteSpace: "nowrap" }}>{Math.round(s.sim * 100)}%（{s.n}件）</span>
                        </div>
                      ))}
                  <div style={{ color: "#45454e", fontSize: 10, marginTop: 4, lineHeight: 1.5 }}>相性＝共通して評価した施設での、点の付け方の近さです（カッコ内は共通の施設数）。</div>
                </div>
              </>}
        </div>
      )}
    </div>
  );
}

function App() {
  const [page,        setPage]        = useState("rate");
  const [saunas,      setSaunas]      = useState([]);
  const [editTarget,  setEditTarget]  = useState(null);
  const [loading,     setLoading]     = useState(true);
  const [loadError,   setLoadError]   = useState(null);
  const [saving,      setSaving]      = useState(false);
  const [toast,       setToast]       = useState({msg:"",type:"ok"});
  const [currentUser, setCurrentUser] = useState(()=>{
    try { const u=sessionStorage.getItem("totonlog_user"); return u?JSON.parse(u):null; } catch{ return null; }
  });
  const pollRef = useRef(null);
  const EPOCH = "1970-01-01T00:00:00Z";
  const [comments,     setComments]     = useState([]);
  const [chatMsgs,     setChatMsgs]     = useState([]);
  const [commentsReady,setCommentsReady]= useState(true);
  const [chatReady,    setChatReady]    = useState(true);
  const [seenNotif,    setSeenNotif]    = useState(EPOCH);
  const [seenChat,     setSeenChat]     = useState(EPOCH);
  const [notifOpen,    setNotifOpen]    = useState(false);
  const [notifSnap,    setNotifSnap]    = useState(EPOCH);
  const [focus,        setFocus]        = useState(null);
  const isAdmin = !!currentUser && ADMIN_NAMES.includes(currentUser.name);
  const isMineEntry = (e) => !!currentUser && !!e && (e.user_id === currentUser.id || e.author === currentUser.name);

  const showToast=(msg,type)=>{setToast({msg,type:type||"ok"});setTimeout(()=>setToast({msg:"",type:"ok"}),3000);};

  const handleLogin=(user)=>{
    setCurrentUser(user);
    try { sessionStorage.setItem("totonlog_user",JSON.stringify(user)); } catch{}
  };
  const handleLogout=()=>{
    setCurrentUser(null);
    try { sessionStorage.removeItem("totonlog_user"); } catch{}
  };

  const loadComments=useCallback(async()=>{
    try{const d=await dbFetchComments();setComments(d);setCommentsReady(true);}
    catch(e){setCommentsReady(false);}
  },[]);
  const loadChat=useCallback(async()=>{
    try{const d=await dbFetchChat();setChatMsgs(d);setChatReady(true);}
    catch(e){setChatReady(false);}
  },[]);
  const loadData=useCallback(async()=>{
    try{const d=await dbFetch();setSaunas(d);setLoadError(null);}
    catch(e){console.error(e);setLoadError(e.message);}
    finally{setLoading(false);}
    loadComments(); loadChat();
  },[]);

  useEffect(()=>{
    if(!currentUser) return;
    setSeenNotif(lsGet("totonlog_seen_notif_"+currentUser.id,EPOCH));
    setSeenChat(lsGet("totonlog_seen_chat_"+currentUser.id,EPOCH));
  },[currentUser?currentUser.id:null]);

  useEffect(()=>{
    if(page!=="chat"||!currentUser) return;
    loadChat();
    const t=setInterval(loadChat,4000);
    return()=>clearInterval(t);
  },[page]);

  useEffect(()=>{
    if(page!=="chat"||!currentUser||chatMsgs.length===0) return;
    const m=maxIso(chatMsgs);
    if(tsOf(m)>tsOf(seenChat)){setSeenChat(m);lsSet("totonlog_seen_chat_"+currentUser.id,m);}
  },[page,chatMsgs]);

  useEffect(()=>{loadData();pollRef.current=setInterval(loadData,15000);return()=>clearInterval(pollRef.current);},[]);

  const handleSave=async(data)=>{
    if(data.id){
      const t=saunas.find(s=>s.id===data.id);
      if(t&&!isMineEntry(t)){showToast("他の人の評価は変更できません","error");return;}
    }
    setSaving(true);
    try{
      if(data.id){
        const locPart=(typeof data.lat==="number"&&typeof data.lng==="number")?{lat:data.lat,lng:data.lng}:{};
        await dbUpdate(data.id,{name:data.name,facility_type:data.facility_type,prefecture:data.prefecture||"",address:data.address||"",homepage:data.homepage||"",...locPart,scores:data.scores,note:data.note,author:data.author,visit_time:data.visit_time||"",updated_at:new Date().toISOString()});
        setSaunas(p=>p.map(s=>s.id===data.id?{...s,...data}:s));
        showToast("✅ 更新しました！");setEditTarget(null);setPage("ranking");
      } else {
        const authorName = currentUser ? currentUser.name : data.author;
        const row={id:genId(),room_id:ROOM_ID,name:data.name,facility_type:data.facility_type,prefecture:data.prefecture||"",address:data.address||"",homepage:data.homepage||"",scores:data.scores,note:data.note,author:authorName,user_id:currentUser?currentUser.id:"",visit_time:data.visit_time||"",created_at:new Date().toISOString(),updated_at:new Date().toISOString()};
        if(typeof data.lat==="number"&&typeof data.lng==="number"){row.lat=data.lat;row.lng=data.lng;}
        const ins=await dbInsert(row);setSaunas(p=>[...p,ins[0]||row]);showToast("✅ 保存しました！");
      }
    }catch(e){console.error(e);showToast("保存失敗: "+e.message,"error");}
    finally{setSaving(false);}
  };

  const handleUpdateEntry=async(id,data)=>{
    const t=saunas.find(s=>s.id===id);
    if(t&&!isMineEntry(t)){showToast("他の人の評価は変更できません","error");return;}
    setSaving(true);
    try{
      await dbUpdate(id,{scores:data.scores,note:data.note,author:data.author,visit_time:data.visit_time||"",updated_at:new Date().toISOString()});
      setSaunas(p=>p.map(s=>s.id===id?{...s,...data}:s));
      showToast("✅ 評価を更新しました！");
    }catch(e){showToast("更新失敗: "+e.message,"error");}
    finally{setSaving(false);}
  };

  const handleUpdateFacility=async(id,data)=>{
    setSaving(true);
    try{
      const targetEntry=saunas.find(s=>s.id===id);
      const sameName=saunas.filter(s=>s.name.trim()===targetEntry.name.trim());
      const localPatch={address:data.address||"",prefecture:data.prefecture||"",homepage:data.homepage||""};
      if(typeof data.lat==="number"&&typeof data.lng==="number"){localPatch.lat=data.lat;localPatch.lng=data.lng;}
      await Promise.all(sameName.map(s=>dbUpdate(s.id,{...localPatch,updated_at:new Date().toISOString()})));
      setSaunas(p=>p.map(s=>s.name.trim()===targetEntry.name.trim()?{...s,...localPatch}:s));
      showToast("✅ 施設情報を更新しました！");
    }catch(e){showToast("施設情報更新失敗: "+e.message,"error");}
    finally{setSaving(false);}
  };

  // 位置情報（緯度経度）が未取得の施設をまとめて取得
  const handleBackfillLocations=async(onProgress)=>{
    const groups=groupByFacility(saunas).filter(g=>!(typeof g.lat==="number"&&typeof g.lng==="number"));
    let ok=0,ng=0;
    for(let i=0;i<groups.length;i++){
      const g=groups[i];
      if(onProgress) onProgress(i,groups.length);
      try{
        const info=await fetchPlaceInfo(g.name,g.address||"");
        if(info.found&&typeof info.lat==="number"){
          const patch={lat:info.lat,lng:info.lng};
          if(!g.address&&info.address) patch.address=info.address;
          if(!g.prefecture&&info.prefecture) patch.prefecture=info.prefecture;
          if(!g.homepage&&info.homepage) patch.homepage=info.homepage;
          await Promise.all(g._entries.map(e=>dbUpdate(e.id,{...patch,updated_at:new Date().toISOString()})));
          setSaunas(p=>p.map(s=>s.name.trim()===g.name.trim()?{...s,...patch}:s));
          ok++;
        } else { ng++; }
      }catch(e){
        console.error(e);
        if(/lat|lng|column/i.test(e.message||"")) throw new Error("Supabaseに lat / lng 列がありません。先にSQLを実行してください");
        ng++;
      }
      await new Promise(r=>setTimeout(r,250));
    }
    if(onProgress) onProgress(groups.length,groups.length);
    showToast("📍 "+ok+"件の位置情報を取得しました");
    return {ok,ng};
  };

  // 名前変更（自分の全評価の author + users テーブルを更新）
  const handleRename=async(newName)=>{
    setSaving(true);
    try{
      // users テーブルの name を更新
      await dbUpdateUser(currentUser.id,{name:newName});
      // saunas テーブルの author を更新（user_id が一致するもの全て）
      const myEntries=saunas.filter(s=>s.user_id===currentUser.id||s.author===currentUser.name);
      await Promise.all(myEntries.map(s=>dbUpdate(s.id,{author:newName,updated_at:new Date().toISOString()})));
      setSaunas(p=>p.map(s=>(s.user_id===currentUser.id||s.author===currentUser.name)?{...s,author:newName}:s));
      try{await apiPatchWhere(COMMENTS_API,"user_id=eq."+encodeURIComponent(currentUser.id),{author:newName});setComments(p=>p.map(x=>x.user_id===currentUser.id?{...x,author:newName}:x));}catch{}
      try{await apiPatchWhere(CHAT_API,"user_id=eq."+encodeURIComponent(currentUser.id),{author:newName});setChatMsgs(p=>p.map(x=>x.user_id===currentUser.id?{...x,author:newName}:x));}catch{}
      const updated={...currentUser,name:newName};
      setCurrentUser(updated);
      try{sessionStorage.setItem("totonlog_user",JSON.stringify(updated));}catch{}
      showToast("✅ 名前を変更しました！");
    }catch(e){showToast("名前変更失敗: "+e.message,"error");}
    finally{setSaving(false);}
  };

  // 評価を自分のアカウントに紐付け（author名で一致するものを紐付け）
  const handleClaimEntries=async(targetAuthor)=>{
    setSaving(true);
    try{
      const targets=saunas.filter(s=>s.author===targetAuthor&&s.user_id!==currentUser.id);
      if(targets.length===0){showToast("紐付け対象がありません","error");return;}
      await Promise.all(targets.map(s=>dbUpdate(s.id,{user_id:currentUser.id,author:currentUser.name,updated_at:new Date().toISOString()})));
      setSaunas(p=>p.map(s=>s.author===targetAuthor&&s.user_id!==currentUser.id?{...s,user_id:currentUser.id,author:currentUser.name}:s));
      showToast("✅ "+targets.length+"件を紐付けました！");
    }catch(e){showToast("紐付け失敗: "+e.message,"error");}
    finally{setSaving(false);}
  };

  const handleAddComment=async(entry,text)=>{
    const row={id:genId(),room_id:ROOM_ID,entry_id:entry.id,user_id:currentUser.id,author:currentUser.name,body:text,created_at:new Date().toISOString()};
    try{const ins=await apiInsertRow(COMMENTS_API,row);setComments(p=>[...p,ins[0]||row]);return true;}
    catch(e){showToast("コメント投稿失敗: "+e.message,"error");return false;}
  };
  const handleDeleteComment=async(id)=>{
    try{await apiDeleteRow(COMMENTS_API,id);setComments(p=>p.filter(x=>x.id!==id));}
    catch(e){showToast("削除失敗: "+e.message,"error");}
  };
  const handleSendChat=async(text)=>{
    const row={id:genId(),room_id:ROOM_ID,user_id:currentUser.id,author:currentUser.name,body:text,created_at:new Date().toISOString()};
    try{const ins=await apiInsertRow(CHAT_API,row);setChatMsgs(p=>[...p,ins[0]||row]);return true;}
    catch(e){showToast("送信失敗: "+e.message,"error");return false;}
  };
  const handleDeleteChat=async(id)=>{
    try{await apiDeleteRow(CHAT_API,id);setChatMsgs(p=>p.filter(x=>x.id!==id));}
    catch(e){showToast("削除失敗: "+e.message,"error");}
  };

  const handleDeleteFacility=async(name)=>{
    if(!isAdmin){showToast("管理者のみ実行できます","error");return;}
    const targets=saunas.filter(s=>s.name.trim()===name.trim());
    try{
      await Promise.all(targets.map(s=>dbDelete(s.id)));
      const ids=new Set(targets.map(s=>s.id));
      setSaunas(p=>p.filter(s=>!ids.has(s.id)));
      showToast("🗑️ 「"+name+"」の評価を"+targets.length+"件削除しました");
    }catch(e){showToast("削除失敗: "+e.message,"error");}
  };

  const handleDelete=async(id)=>{
    const t=saunas.find(s=>s.id===id);
    if(t&&!(isAdmin||isMineEntry(t))){showToast("他の人の評価は削除できません","error");return;}
    try{await dbDelete(id);setSaunas(p=>p.filter(s=>s.id!==id));showToast("削除しました");}
    catch(e){showToast("削除失敗: "+e.message,"error");}
  };

  if(!currentUser) return <LoginPage onLogin={handleLogin}/>;

  if(loading) return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16}}><div style={{fontSize:48}}>🧖</div><div style={{color:"#5a5a6a",fontSize:15}}>読み込み中...</div></div>;
  if(loadError) return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:"0 16px"}}>
      <div style={{maxWidth:460,width:"100%",background:"#2a1a1a",border:"1px solid #5a2a2a",borderRadius:14,padding:"28px"}}>
        <div style={{fontSize:40,textAlign:"center",marginBottom:14}}>⚠️</div>
        <div style={{color:"#e05858",fontWeight:700,fontSize:16,textAlign:"center",marginBottom:12}}>接続に失敗しました</div>
        <code style={{display:"block",background:"#1a1a1a",padding:"10px 14px",borderRadius:8,color:"#e08888",fontSize:12,wordBreak:"break-all",marginBottom:16,lineHeight:1.6}}>{loadError}</code>
        <button onClick={()=>{setLoading(true);setLoadError(null);loadData();}} style={{width:"100%",padding:"13px",background:"linear-gradient(135deg,#4AB8D4,#2e8fa8)",border:"none",borderRadius:10,color:"#fff",fontSize:15,fontWeight:700,cursor:"pointer"}}>🔄 再試行</button>
      </div>
    </div>
  );

  const facilityCount=groupByFacility(saunas).length;
  const myIds=new Set(saunas.filter(s=>s.user_id===currentUser.id||s.author===currentUser.name).map(s=>s.id));
  const notifItems=comments.filter(x=>myIds.has(x.entry_id)&&x.user_id!==currentUser.id).sort((a,b)=>tsOf(b.created_at)-tsOf(a.created_at));
  const unreadNotif=notifItems.filter(x=>tsOf(x.created_at)>tsOf(seenNotif)).length;
  const unreadChat=chatMsgs.filter(m=>m.user_id!==currentUser.id&&tsOf(m.created_at)>tsOf(seenChat)).length;
  const openNotif=()=>{
    setNotifSnap(seenNotif); setNotifOpen(true);
    if(notifItems.length){const m=maxIso(notifItems);if(tsOf(m)>tsOf(seenNotif)){setSeenNotif(m);lsSet("totonlog_seen_notif_"+currentUser.id,m);}}
  };
  const goNotif=(cm)=>{
    const en=saunas.find(s=>s.id===cm.entry_id);
    setNotifOpen(false);
    if(!en) return;
    setFocus({name:en.name,entryId:en.id,t:Date.now()});
    setPage("ranking");
  };
  const tabs=[
    {key:"rate",   icon:"⭐", text:editTarget?"編集中":"評価"},
    {key:"ranking",icon:"🏆", text:"ランキング"},
    {key:"reco",   icon:"✨", text:"おすすめ"},
    {key:"map",    icon:"🗺", text:"マップ"},
    {key:"chat",   icon:"💬", text:"チャット", badge:unreadChat},
    {key:"mypage", icon:"👤", text:currentUser.name},
  ];

  return (
    <div style={{minHeight:"100vh"}}>
      <div style={{background:"linear-gradient(180deg,#1a1a20,#1C1C1E)",borderBottom:"1px solid #26262c",padding:"12px 14px 0",position:"sticky",top:0,zIndex:10,overflowX:"hidden",width:"100%"}}>
        <div style={{maxWidth:520,margin:"0 auto"}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
            <span style={{fontSize:26}}>🧖</span>
            <div>
              <h1 style={{margin:0,fontSize:19,fontWeight:800,letterSpacing:"-0.02em"}}>ととログ</h1>
              <div style={{color:"#5a5a6a",fontSize:10}}>
                {saunas.length>0?facilityCount+"施設 / "+saunas.length+"件":"サウナを評価・記録しよう"}
                {saving&&<span style={{color:"#4AB8D4",marginLeft:8}}>💾</span>}
              </div>
            </div>
            <button onClick={openNotif} aria-label="通知" style={{marginLeft:"auto",position:"relative",background:"#26262c",border:"1px solid #35353e",borderRadius:"50%",width:38,height:38,fontSize:18,cursor:"pointer",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
              🔔
              {unreadNotif>0&&<span style={{position:"absolute",top:-4,right:-4,background:"#e05858",color:"#fff",borderRadius:10,minWidth:18,height:18,padding:"0 4px",fontSize:11,fontWeight:700,lineHeight:"18px",textAlign:"center"}}>{unreadNotif>99?"99+":unreadNotif}</span>}
            </button>
          </div>
          <div style={{display:"flex"}}>
            {tabs.map(tab=>(
              <button key={tab.key} onClick={()=>{setPage(tab.key);setFocus(null);if(tab.key==="rate"&&page==="rate")setEditTarget(null);}}
                className="tab-btn"
                style={{minWidth:0,padding:"7px 2px 8px",color:page===tab.key?"#4AB8D4":"#5a5a6a",borderBottom:page===tab.key?"2px solid #4AB8D4":"2px solid transparent"}}>
                <span style={{display:"block",fontSize:17,lineHeight:1.25,position:"relative"}}>
                  {tab.icon}
                  {tab.badge>0&&<span style={{position:"absolute",top:-2,left:"calc(50% + 6px)",background:"#e05858",color:"#fff",borderRadius:10,minWidth:16,height:16,padding:"0 4px",fontSize:10,fontWeight:700,lineHeight:"16px"}}>{tab.badge>99?"99+":tab.badge}</span>}
                </span>
                <span style={{display:"block",fontSize:10,fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{tab.text}</span>
              </button>
            ))}
          </div>
        </div>
      </div>
      <div className="rp-pad">
        {page==="rate"&&<RatingPage onSave={handleSave} editTarget={editTarget} onCancelEdit={()=>{setEditTarget(null);setPage("ranking");}} saving={saving} allSaunas={saunas} currentUser={currentUser}/>}
        {page==="ranking"&&<RankingPage saunas={saunas} onDelete={handleDelete} onUpdateEntry={handleUpdateEntry} onUpdateFacility={handleUpdateFacility} saving={saving} comments={comments} currentUser={currentUser} onAddComment={handleAddComment} onDeleteComment={handleDeleteComment} focus={focus} isAdmin={isAdmin} onDeleteFacility={handleDeleteFacility}/>}
        {page==="reco"&&<RecommendPage saunas={saunas} currentUser={currentUser}/>}
        {page==="chat"&&<ChatPage messages={chatMsgs} currentUser={currentUser} onSend={handleSendChat} onDelete={handleDeleteChat} ready={chatReady}/>}
        {page==="map"&&<MapPage saunas={saunas} onBackfill={handleBackfillLocations}/>}
        {page==="mypage"&&<MyPage currentUser={currentUser} saunas={saunas} onLogout={handleLogout} onUpdateEntry={handleUpdateEntry} onDelete={handleDelete} onRename={handleRename} onClaim={handleClaimEntries} saving={saving} comments={comments} onAddComment={handleAddComment} onDeleteComment={handleDeleteComment}/>}
      </div>
      {notifOpen&&<NotificationPanel items={notifItems} saunas={saunas} seenSnap={notifSnap} ready={commentsReady} onGo={goNotif} onClose={()=>setNotifOpen(false)}/>}
      <Toast msg={toast.msg} type={toast.type}/>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
