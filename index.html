async function fetchPlaceInfo(facilityName, addressHint) {
  const q = addressHint ? facilityName + " " + addressHint : facilityName + " サウナ 温浴";
  const searchRes = await fetch("https://places.googleapis.com/v1/places:searchText", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-Goog-Api-Key": GOOGLE_API_KEY,
      "X-Goog-FieldMask": "places.displayName,places.formattedAddress,places.websiteUri,places.location",
    },
    body: JSON.stringify({ textQuery: q, languageCode: "ja", regionCode: "JP", maxResultCount: 1 }),
  });
  if (!searchRes.ok) throw new Error("Places API error: " + searchRes.status);
  const data = await searchRes.json();
  const place = data.places && data.places[0];
  if (!place) return { address: null, prefecture: null, homepage: null, lat: null, lng: null, found: false };
  const address = place.formattedAddress || null;
  const homepage = place.websiteUri || null;
  const prefecture = address ? extractPrefecture(address) : null;
  const lat = place.location && typeof place.location.latitude === "number" ? place.location.latitude : null;
  const lng = place.location && typeof place.location.longitude === "number" ? place.location.longitude : null;
  return { address, prefecture, homepage, lat, lng, found: true };
}

function avg(scores) {
  const vals = Object.values(scores).filter(Boolean);
  if (!vals.length) return 0;
  return vals.reduce((a, b) => a + b, 0) / vals.length;
}
function customAvg(scores, keys) {
  if (!keys || !keys.length) return avg(scores);
  const vals = keys.map(k => scores[k] || 0).filter(Boolean);
  if (!vals.length) return 0;
  return vals.reduce((a, b) => a + b, 0) / vals.length;
}
function countFives(scores) { return Object.values(scores).filter(v => v === 5).length; }

function groupByFacility(saunas) {
  const map = {};
  saunas.forEach(s => {
    const key = s.name.trim();
    if (!map[key]) {
      map[key] = { ...s, _entries: [s], scores: { ...s.scores } };
    } else {
      map[key]._entries.push(s);
      CATEGORIES.forEach(c => { map[key].scores[c.key] = (map[key].scores[c.key] || 0) + (s.scores[c.key] || 0); });
    }
  });
  Object.values(map).forEach(g => {
    const n = g._entries.length;
    if (n > 1) {
      CATEGORIES.forEach(c => { g.scores[c.key] = Math.round((g.scores[c.key] / n) * 10) / 10; });
      const withAddr = g._entries.find(e => e.address); if (withAddr) g.address = withAddr.address;
      const withHP   = g._entries.find(e => e.homepage); if (withHP) g.homepage = withHP.homepage;
      const withType = g._entries.find(e => e.facility_type); if (withType) g.facility_type = withType.facility_type;
      const withPref = g._entries.find(e => e.prefecture); if (withPref) g.prefecture = withPref.prefecture;
      const withLoc  = g._entries.find(e => typeof e.lat === "number" && typeof e.lng === "number"); if (withLoc) { g.lat = withLoc.lat; g.lng = withLoc.lng; }
    }
    g._count = n;
  });
  return Object.values(map);
}

function ScoreCircle({ value, size }) {
  size = size || 72;
  const r = size/2-6, circ = 2*Math.PI*r, dash = (value/5)*circ;
  const color = value>=4?"#4AB8D4":value>=3?"#C8956A":value>0?"#e05858":"#3a3a40";
  return (
    <svg width={size} height={size} style={{transform:"rotate(-90deg)",flexShrink:0}}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#2a2a2e" strokeWidth={6}/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={6}
        strokeDasharray={dash+" "+circ} strokeLinecap="round" style={{transition:"stroke-dasharray 0.5s ease"}}/>
      <text x={size/2} y={size/2+1} textAnchor="middle" dominantBaseline="middle"
        fill={color} fontSize={size>=72?20:size>=56?14:12} fontWeight="700" fontFamily="system-ui"
        style={{transform:"rotate(90deg)",transformOrigin:(size/2)+"px "+(size/2)+"px"}}>
        {value>0?value.toFixed(1):"—"}
      </text>
    </svg>
  );
}

function NameInput({ value, onChange, allSaunas, onSelectExisting }) {
  const [suggestions, setSuggestions] = useState([]);
  const [showSug, setShowSug] = useState(false);
  const wrapRef = useRef(null);
  useEffect(()=>{
    if (!value.trim()) { setSuggestions([]); return; }
    const q = value.trim().toLowerCase();
    const names = [...new Set(allSaunas.map(s=>s.name.trim()))];
    setSuggestions(names.filter(n=>n.toLowerCase().includes(q)&&n.toLowerCase()!==q).slice(0,5));
  },[value, allSaunas]);
  useEffect(()=>{
    function h(e) { if (wrapRef.current&&!wrapRef.current.contains(e.target)) setShowSug(false); }
    document.addEventListener("mousedown",h);
    return ()=>document.removeEventListener("mousedown",h);
  },[]);
  return (
    <div ref={wrapRef} style={{position:"relative"}}>
      <input type="text" value={value} onChange={e=>{onChange(e.target.value);setShowSug(true);}} onFocus={()=>setShowSug(true)}
        placeholder="例：サウナしきじ"
        style={{width:"100%",background:"#26262c",border:"1.5px solid #35353e",borderRadius:10,padding:"13px 15px",color:"#E8EDF2",fontSize:18,fontWeight:600,outline:"none"}}/>
      {showSug&&suggestions.length>0&&(
        <div style={{position:"absolute",top:"calc(100% + 4px)",left:0,right:0,background:"#26262c",border:"1px solid #35353e",borderRadius:10,zIndex:100,overflow:"hidden",boxShadow:"0 8px 24px #00000080"}}>
          <div style={{padding:"8px 14px 4px",color:"#5a5a6a",fontSize:11,fontWeight:600,letterSpacing:"0.06em"}}>登録済み施設</div>
          {suggestions.map((name,i)=>{
            const entries = allSaunas.filter(s=>s.name.trim()===name);
            const ft = entries.find(e=>e.facility_type);
            const t = ft?FACILITY_TYPES.find(f=>f.key===ft.facility_type):null;
            return (
              <button key={i} onClick={()=>{onSelectExisting(name,entries[0]);setShowSug(false);}}
                style={{width:"100%",padding:"10px 14px",background:"none",border:"none",borderTop:"1px solid #2e2e36",cursor:"pointer",display:"flex",alignItems:"center",gap:10,textAlign:"left"}}
                onMouseEnter={e=>e.currentTarget.style.background="#2e2e36"}
                onMouseLeave={e=>e.currentTarget.style.background="none"}>
                <span style={{fontSize:18}}>{t?t.icon:"🧖"}</span>
                <div>
                  <div style={{color:"#E8EDF2",fontWeight:600,fontSize:14}}>{name}</div>
                  <div style={{color:"#5a5a6a",fontSize:11,marginTop:1}}>{t?t.label:""}{entries.length>1?" · "+entries.length+"件の評価":""}</div>
                </div>
                <span style={{marginLeft:"auto",color:"#4AB8D4",fontSize:12,fontWeight:600}}>選ぶ →</span>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

function RatingPage({ onSave, editTarget, onCancelEdit, saving, allSaunas, currentUser }) {
  const empty = Object.fromEntries(CATEGORIES.map(c=>[c.key,0]));
  const [name,          setName]         = useState(editTarget?editTarget.name:"");
  const [facilityType,  setFacilityType] = useState(editTarget?(editTarget.facility_type||""):"");
  const [scores,        setScores]       = useState(editTarget?editTarget.scores:empty);
  const [note,          setNote]         = useState(editTarget?(editTarget.note||""):"");
  const [author,        setAuthor]       = useState(editTarget?(editTarget.author||""):(currentUser?currentUser.name:""));
  const [openHint,      setOpenHint]     = useState(null);
  const [isExisting,    setIsExisting]   = useState(false);
  const [visitTime,     setVisitTime]    = useState(editTarget?(editTarget.visit_time||""):"");
  const [prefecture,    setPrefecture]   = useState(editTarget?(editTarget.prefecture||""):"");
  const [homepage,      setHomepage]     = useState(editTarget?(editTarget.homepage||""):"");
  const [address,       setAddress]      = useState(editTarget?(editTarget.address||""):"");
  const [lat,           setLat]          = useState(editTarget&&typeof editTarget.lat==="number"?editTarget.lat:null);
  const [lng,           setLng]          = useState(editTarget&&typeof editTarget.lng==="number"?editTarget.lng:null);
  const [fetchingPlace, setFetchingPlace]= useState(false);
  const [placeConfirm,  setPlaceConfirm] = useState(null);
  const [fetchPlaceError,setFetchPlaceError]= useState("");

  useEffect(()=>{
    if(editTarget){
      setName(editTarget.name); setFacilityType(editTarget.facility_type||"");
      setAddress(editTarget.address||""); setHomepage(editTarget.homepage||"");
      setPrefecture(editTarget.prefecture||"");
      setLat(typeof editTarget.lat==="number"?editTarget.lat:null); setLng(typeof editTarget.lng==="number"?editTarget.lng:null);
      setScores(editTarget.scores); setNote(editTarget.note||""); setAuthor(editTarget.author||""); setVisitTime(editTarget.visit_time||"");
    } else {
      setName(""); setFacilityType(""); setAddress(""); setHomepage("");
      setPrefecture(""); setScores(empty); setNote(""); setAuthor(currentUser?currentUser.name:""); setVisitTime(""); setIsExisting(false);
      setPlaceConfirm(null); setFetchPlaceError(""); setLat(null); setLng(null);
    }
  },[editTarget?editTarget.id:null]);

  const handleSelectExisting = (selectedName, existing) => {
    setName(selectedName); setIsExisting(true);
    if (existing) {
      if (existing.facility_type) setFacilityType(existing.facility_type);
      if (existing.address)       setAddress(existing.address);
      if (existing.homepage)      setHomepage(existing.homepage);
      if (existing.prefecture)    setPrefecture(existing.prefecture);
      if (typeof existing.lat==="number"&&typeof existing.lng==="number") { setLat(existing.lat); setLng(existing.lng); }
    }
    setScores(empty);
  };

  const handleFetchPlaceInfo = async () => {
    if (!name.trim()) return;
    setFetchingPlace(true); setFetchPlaceError(""); setPlaceConfirm(null);
    try {
      const info = await fetchPlaceInfo(name.trim());
      if (!info.found) setFetchPlaceError("施設情報が見つかりませんでした。手動で入力してください。");
      else setPlaceConfirm(info);
    } catch(e) { setFetchPlaceError("取得失敗: " + e.message); }
    finally { setFetchingPlace(false); }
  };

  const overall = avg(scores);
  const allFilled = name.trim() && facilityType && Object.values(scores).every(v=>v>0);
  const iStyle = {width:"100%",background:"#26262c",border:"1.5px solid #35353e",borderRadius:10,color:"#E8EDF2",outline:"none",transition:"border-color 0.2s"};

  return (
    <div className="rp-container">
      <div style={{marginBottom:10}}>
        <label style={{display:"block",color:"#8888a0",fontSize:12,fontWeight:600,letterSpacing:"0.08em",marginBottom:7,textTransform:"uppercase"}}>サウナ名</label>
        <NameInput value={name} onChange={v=>{setName(v);setIsExisting(false);}} allSaunas={allSaunas} onSelectExisting={handleSelectExisting}/>
        {isExisting&&<div style={{marginTop:6,padding:"6px 12px",background:"#4AB8D420",border:"1px solid #4AB8D440",borderRadius:8,color:"#4AB8D4",fontSize:12}}>✅ 登録済み施設 — あなたの評価を追加します</div>}
      </div>

      {name.trim()&&!editTarget&&(
        <div style={{marginBottom:14}}>
          <button onClick={handleFetchPlaceInfo} disabled={fetchingPlace}
            style={{width:"100%",padding:"11px",background:fetchingPlace?"#2a2a2e":"#1a2a3a",border:"1px solid "+(fetchingPlace?"#35353e":"#2a4a6a"),borderRadius:10,color:fetchingPlace?"#5a5a6a":"#4AB8D4",fontSize:13,fontWeight:700,cursor:fetchingPlace?"not-allowed":"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:7}}>
            {fetchingPlace?<><span className="spin">⟳</span> 施設情報を検索中…</>:"🔍 住所・都道府県・HPを自動取得"}
          </button>
          {fetchPlaceError&&<div style={{marginTop:6,color:"#e05858",fontSize:12,padding:"6px 12px",background:"#2a1a1a",borderRadius:8,border:"1px solid #5a2a2a"}}>{fetchPlaceError}</div>}
          {placeConfirm&&(
            <div style={{marginTop:8,background:"#1a2a3a",border:"1px solid #2a4a6a",borderRadius:10,overflow:"hidden"}}>
              <div style={{padding:"10px 14px",borderBottom:"1px solid #2a4a6a",color:"#4AB8D4",fontSize:12,fontWeight:700}}>📍 取得した情報 — 内容を確認してください</div>
              <div style={{padding:"10px 14px",display:"flex",flexDirection:"column",gap:6}}>
                <div style={{fontSize:13,color:"#E8EDF2"}}><span style={{color:"#5a5a6a",fontSize:11}}>住所：</span>{placeConfirm.address||"取得できませんでした"}</div>
                <div style={{fontSize:13,color:"#E8EDF2"}}><span style={{color:"#5a5a6a",fontSize:11}}>都道府県：</span>{placeConfirm.prefecture||"取得できませんでした"}</div>
                <div style={{fontSize:13,color:"#E8EDF2"}}><span style={{color:"#5a5a6a",fontSize:11}}>公式HP：</span>{placeConfirm.homepage?<a href={placeConfirm.homepage} target="_blank" style={{color:"#4AB8D4"}}>{placeConfirm.homepage}</a>:"なし"}</div>
              </div>
              <div style={{padding:"8px 14px",display:"flex",gap:8}}>
                <button onClick={()=>{setAddress(placeConfirm.address||"");setPrefecture(placeConfirm.prefecture||"");setHomepage(placeConfirm.homepage||"");if(typeof placeConfirm.lat==="number"){setLat(placeConfirm.lat);setLng(placeConfirm.lng);}setPlaceConfirm(null);}}
                  style={{flex:2,padding:"9px",background:"linear-gradient(135deg,#4AB8D4,#2e8fa8)",border:"none",borderRadius:8,color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer"}}>✅ この情報で登録</button>
                <button onClick={()=>setPlaceConfirm(null)} style={{flex:1,padding:"9px",background:"#26262c",border:"1px solid #35353e",borderRadius:8,color:"#8888a0",fontSize:13,cursor:"pointer"}}>キャンセル</button>
              </div>
            </div>
          )}
        </div>
      )}

      <div style={{marginBottom:14}}>
        <label style={{display:"block",color:"#8888a0",fontSize:12,fontWeight:600,letterSpacing:"0.08em",marginBottom:7,textTransform:"uppercase"}}>施設タイプ</label>
        <div className="facility-btns">
          {FACILITY_TYPES.map(t=>{
            const active=facilityType===t.key;
            return <button key={t.key} onClick={()=>setFacilityType(active?"":t.key)} className="facility-btn"
              style={{border:active?"1.5px solid #4AB8D4":"1.5px solid #35353e",background:active?"#4AB8D420":"#26262c",color:active?"#4AB8D4":"#8888a0"}}>
              {t.icon} {t.label}</button>;
          })}
        </div>
      </div>

      <div style={{marginBottom:18}}>
        <label style={{display:"block",color:"#8888a0",fontSize:12,fontWeight:600,letterSpacing:"0.08em",marginBottom:7,textTransform:"uppercase"}}>投稿者名（任意）</label>
        <input value={author} onChange={e=>setAuthor(e.target.value)} placeholder="例：サウナ太郎"
          style={{...iStyle,padding:"11px 15px",fontSize:16}}
          onFocus={e=>e.target.style.borderColor="#4AB8D4"} onBlur={e=>e.target.style.borderColor="#35353e"}/>
      </div>

      <div style={{marginBottom:18}}>
        <label style={{display:"block",color:"#8888a0",fontSize:12,fontWeight:600,letterSpacing:"0.08em",marginBottom:7,textTransform:"uppercase"}}>訪問時間帯（任意）</label>
        <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
          {TIME_SLOTS.map(t=>{
            const active=visitTime===t.key;
            return <button key={t.key} onClick={()=>setVisitTime(active?"":t.key)}
              style={{padding:"7px 12px",borderRadius:20,fontSize:13,fontWeight:600,cursor:"pointer",transition:"all 0.15s",
                border:active?"1.5px solid #4AB8D4":"1.5px solid #35353e",
                background:active?"#4AB8D420":"#26262c",
                color:active?"#4AB8D4":"#8888a0"}}>
              {t.label}
            </button>;
          })}
        </div>
      </div>

      <div style={{background:"linear-gradient(135deg,#26262c,#1e2028)",borderRadius:16,padding:"16px 20px",marginBottom:18,display:"flex",alignItems:"center",gap:16,border:"1px solid #2e2e36"}}>
        <ScoreCircle value={overall} size={76}/>
        <div>
          <div style={{color:"#8888a0",fontSize:12,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.06em"}}>総合評価</div>
          <div style={{color:"#E8EDF2",fontSize:14,marginTop:4}}>
            {overall===0?"項目を評価してください":overall>=4.5?"最高のサウナ 🏆":overall>=4?"かなりおすすめ ✨":overall>=3?"まあまあ 👍":overall>=2?"少し物足りない 😐":"改善が必要 😓"}
          </div>
        </div>
      </div>

      <div style={{display:"flex",flexDirection:"column",gap:6}}>
        {CATEGORIES.map(cat=>(
          <div key={cat.key} style={{background:"#26262c",borderRadius:12,border:scores[cat.key]?"1px solid #35353e":"1px solid #2c2c32",overflow:"hidden"}}>
            <div style={{padding:"13px 15px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontSize:20}}>{cat.icon}</span>
                  <span style={{color:"#E8EDF2",fontWeight:600,fontSize:15}}>{cat.label}</span>
                  <button onClick={()=>setOpenHint(openHint===cat.key?null:cat.key)} style={{background:"none",border:"none",cursor:"pointer",color:openHint===cat.key?"#4AB8D4":"#5a5a6a",fontSize:14,padding:"0 3px"}}>ℹ</button>
                </div>
                {scores[cat.key]>0&&<span style={{background:"#1C1C1E",borderRadius:20,padding:"2px 10px",color:"#4AB8D4",fontSize:13,fontWeight:700}}>{scores[cat.key]}.0</span>}
              </div>
              <StarPicker value={scores[cat.key]} onChange={v=>setScores(s=>({...s,[cat.key]:v}))}/>
            </div>
            {openHint===cat.key&&<div style={{borderTop:"1px solid #2e2e36",padding:"9px 15px",background:"#1e1e24",color:"#7a9ab0",fontSize:12,lineHeight:1.7}}>📋 {cat.hint}</div>}
          </div>
        ))}
      </div>

      <div style={{marginTop:14}}>
        <label style={{display:"block",color:"#8888a0",fontSize:12,fontWeight:600,letterSpacing:"0.08em",marginBottom:7,textTransform:"uppercase"}}>メモ（任意）</label>
        <textarea value={note} onChange={e=>setNote(e.target.value)} placeholder="感想や特記事項など..." rows={3}
          style={{...iStyle,padding:"11px 15px",fontSize:16,resize:"vertical"}}
          onFocus={e=>e.target.style.borderColor="#4AB8D4"} onBlur={e=>e.target.style.borderColor="#35353e"}/>
      </div>

      <div style={{display:"flex",gap:10,marginTop:18}}>
        {editTarget&&<button onClick={onCancelEdit} style={{flex:1,padding:"14px",background:"#26262c",border:"1px solid #35353e",borderRadius:12,color:"#8888a0",fontSize:15,fontWeight:600,cursor:"pointer"}}>キャンセル</button>}
        <button onClick={()=>allFilled&&!saving&&onSave({name:name.trim(),facility_type:facilityType,address,prefecture,homepage,lat,lng,scores,note,author:author.trim(),visit_time:visitTime,id:editTarget?editTarget.id:null})}
          disabled={!allFilled||saving}
          style={{flex:2,padding:"14px",background:!allFilled||saving?"#2a2a2e":"linear-gradient(135deg,#4AB8D4,#2e8fa8)",border:"none",borderRadius:12,color:!allFilled||saving?"#5a5a6a":"#fff",fontSize:16,fontWeight:700,cursor:!allFilled||saving?"not-allowed":"pointer",transition:"all 0.3s",boxShadow:allFilled&&!saving?"0 4px 20px #4AB8D430":"none"}}>
          {saving?"💾 保存中…":editTarget?"更新する":"このサウナを保存"}
        </button>
      </div>
    </div>
  );
}

function RankingPage({ saunas, onDelete, onUpdateEntry, onUpdateFacility, saving, comments, currentUser, onAddComment, onDeleteComment, focus, isAdmin, onDeleteFacility }) {
  const [selectedKeys,       setSelectedKeys]       = useState([]);
  const [facilityFilter,     setFacilityFilter]     = useState("all");
  const [prefFilter,         setPrefFilter]         = useState([]);
  const [expandedName,       setExpandedName]       = useState(null);
  const [editingEntry,       setEditingEntry]       = useState(null);
  const [confirmDelete,      setConfirmDelete]      = useState(null);
  const [showPrefFilter,     setShowPrefFilter]     = useState(false);
  const [showFacilityFilter, setShowFacilityFilter] = useState(false);
  const [searchQuery,        setSearchQuery]        = useState("");
  const [searchResult,       setSearchResult]       = useState(null);
  const [searchCandidates,   setSearchCandidates]   = useState([]);
  const itemRefs = useRef({});
  const [confirmFacDel, setConfirmFacDel] = useState(null);
  const isMine = (e) => !!currentUser && (e.user_id === currentUser.id || e.author === currentUser.name);

  useEffect(()=>{
    if(!focus) return;
    const g = groupByFacility(saunas).find(x=>x.name.trim()===focus.name.trim());
    const nm = g ? g.name : focus.name;
    setFacilityFilter("all"); setPrefFilter([]); setSearchResult(null);
    setExpandedName(nm);
    setTimeout(()=>{ const el=itemRefs.current[nm]; if(el&&el.scrollIntoView) el.scrollIntoView({behavior:"smooth",block:"start"}); },300);
  },[focus]);

  const isAllMode = selectedKeys.length===0;
  const toggleKey = k=>setSelectedKeys(p=>p.includes(k)?p.filter(x=>x!==k):[...p,k]);

  const grouped = groupByFacility(saunas);
  const availablePrefs = [...new Set(grouped.map(s=>s.prefecture).filter(Boolean))].sort((a,b)=>{
    return PREFS_LIST.indexOf(a)-PREFS_LIST.indexOf(b);
  });

  const filtered = grouped
    .filter(s=>facilityFilter==="all"||s.facility_type===facilityFilter)
    .filter(s=>prefFilter.length===0||prefFilter.includes(s.prefecture));

  const sorted = [...filtered].sort((a,b)=>{
    const va=customAvg(a.scores,isAllMode?null:selectedKeys);
    const vb=customAvg(b.scores,isAllMode?null:selectedKeys);
    if(vb!==va) return vb-va;
    return isAllMode?countFives(b.scores)-countFives(a.scores):avg(b.scores)-avg(a.scores);
  });
  const medals=["#FFD700","#C0C0C0","#CD7F32"];

  const handleSearchInput = (q) => {
    setSearchQuery(q);
    setSearchResult(null);
    if (!q.trim()) { setSearchCandidates([]); return; }
    const hits = sorted.map((s,i)=>({name:s.name,index:i})).filter(s=>s.name.toLowerCase().includes(q.trim().toLowerCase()));
    setSearchCandidates(hits.slice(0,8));
  };

  const handleSelectCandidate = (name, index) => {
    setSearchQuery(name);
    setSearchCandidates([]);
    setSearchResult({name,index});
    setTimeout(()=>{
      const el = itemRefs.current[name];
      if (el) el.scrollIntoView({behavior:"smooth",block:"center"});
    }, 80);
  };

  const openMap=(address,name)=>{
    const q=encodeURIComponent((address&&address.trim()?address:name).trim());
    window.open("https://www.google.com/maps/search/?api=1&query="+q,"_blank");
  };

  return (
    <div className="rp-container">
      {editingEntry&&(
        <EditEntryModal entry={editingEntry}
          onSave={async(id,data)=>{await onUpdateEntry(id,data);setEditingEntry(null);}}
          onSaveFacility={async(id,data)=>{await onUpdateFacility(id,data);setEditingEntry(null);}}
          onClose={()=>setEditingEntry(null)} saving={saving}/>
      )}

      {/* 検索バー */}
      <div style={{marginBottom:12,position:"relative",zIndex:20}}>
        <div style={{position:"relative",display:"flex",alignItems:"center"}}>
          <span style={{position:"absolute",left:12,fontSize:15,pointerEvents:"none"}}>🔍</span>
          <input type="text" value={searchQuery} onChange={e=>handleSearchInput(e.target.value)}
            placeholder="施設名で検索…"
            style={{width:"100%",background:"#26262c",border:"1.5px solid "+(searchResult?"#4AB8D4":"#35353e"),borderRadius:searchQuery.trim()&&searchCandidates.length>0?"10px 10px 0 0":"10px",padding:"11px 36px 11px 36px",color:"#E8EDF2",fontSize:16,outline:"none",transition:"border-color 0.2s"}}/>
          {searchQuery&&<button onClick={()=>{setSearchQuery("");setSearchResult(null);setSearchCandidates([]);}} style={{position:"absolute",right:10,background:"none",border:"none",cursor:"pointer",color:"#5a5a6a",fontSize:17,lineHeight:1}}>✕</button>}
        </div>
        {searchCandidates.length>0&&(
          <div style={{background:"#26262c",border:"1.5px solid #4AB8D4",borderTop:"none",borderRadius:"0 0 10px 10px",overflow:"hidden",boxShadow:"0 8px 24px #00000060"}}>
            {searchCandidates.map((c,i)=>(
              <button key={c.name} onClick={()=>handleSelectCandidate(c.name,c.index)}
                style={{width:"100%",padding:"10px 14px",background:"none",border:"none",borderTop:"1px solid #35353e",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,textAlign:"left"}}
                onMouseEnter={e=>e.currentTarget.style.background="#2e2e36"}
                onMouseLeave={e=>e.currentTarget.style.background="none"}>
                <div style={{display:"flex",alignItems:"center",gap:8,minWidth:0}}>
                  <span style={{fontSize:14}}>🧖</span>
                  <span style={{color:"#E8EDF2",fontSize:14,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.name}</span>
                </div>
                <span style={{background:"#1C1C1E",borderRadius:20,padding:"2px 9px",fontSize:11,color:"#4AB8D4",fontWeight:700,flexShrink:0}}>{c.index+1}位</span>
              </button>
            ))}
          </div>
        )}
        {searchQuery.trim()&&searchCandidates.length===0&&!searchResult&&(
          <div style={{marginTop:6,padding:"6px 12px",background:"#2a1a1a",border:"1px solid #5a2a2a",borderRadius:8,fontSize:12,color:"#e05858"}}>「{searchQuery}」は登録されていません</div>
        )}
        {searchResult&&(
          <div style={{marginTop:6,padding:"6px 12px",background:"#4AB8D415",border:"1px solid #4AB8D430",borderRadius:8,fontSize:12,color:"#4AB8D4",display:"flex",alignItems:"center",gap:6}}>
            ✅ 「{searchResult.name}」({searchResult.index+1}位) にジャンプしました
          </div>
        )}
      </div>

      {/* 都道府県フィルター */}
      <div style={{marginBottom:8}}>
        <button onClick={()=>setShowPrefFilter(v=>!v)}
          style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 14px",background:"#26262c",border:"1px solid "+(prefFilter.length>0?"#4AB8D4":"#35353e"),borderRadius:showPrefFilter?"10px 10px 0 0":"10px",cursor:"pointer",transition:"all 0.2s"}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <span style={{color:"#8888a0",fontSize:12,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.06em"}}>🗾 都道府県で絞り込み</span>
            {prefFilter.length>0&&<span style={{background:"#4AB8D4",borderRadius:20,padding:"1px 8px",fontSize:10,color:"#1C1C1E",fontWeight:700}}>{prefFilter.length}件選択中</span>}
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            {prefFilter.length>0&&<button onClick={e=>{e.stopPropagation();setPrefFilter([]);}} style={{background:"none",border:"none",cursor:"pointer",color:"#5a5a6a",fontSize:11,textDecoration:"underline"}}>リセット</button>}
            <span style={{color:"#5a5a6a",fontSize:12,display:"inline-block",transform:showPrefFilter?"rotate(180deg)":"rotate(0deg)",transition:"transform 0.2s"}}>▼</span>
          </div>
        </button>
        {showPrefFilter&&(
          <div style={{background:"#26262c",border:"1px solid #35353e",borderTop:"none",borderRadius:"0 0 10px 10px",padding:"12px 14px"}}>
            {availablePrefs.length===0
              ?<div style={{color:"#5a5a6a",fontSize:12}}>都道府県情報のある施設がありません</div>
              :<div style={{display:"flex",flexDirection:"column",gap:10}}>
                {PREF_REGIONS.map(region=>{
                  const regionPrefs = region.prefs.filter(p=>availablePrefs.includes(p));
                  if (regionPrefs.length===0) return null;
                  return (
                    <div key={region.label}>
                      <div style={{color:"#5a5a6a",fontSize:10,fontWeight:700,letterSpacing:"0.06em",marginBottom:5,textTransform:"uppercase"}}>{region.label}</div>
                      <div className="filter-chips">
                        {regionPrefs.map(p=>{
                          const active=prefFilter.includes(p);
                          return <button key={p} onClick={()=>setPrefFilter(prev=>prev.includes(p)?prev.filter(x=>x!==p):[...prev,p])}
                            className="filter-chip"
                            style={{border:active?"1.5px solid #4AB8D4":"1.5px solid #35353e",background:active?"#4AB8D420":"#1C1C1E",color:active?"#4AB8D4":"#8888a0",position:"relative"}}>
                            {p}
                            {active&&<span style={{position:"absolute",top:-5,right:-5,background:"#4AB8D4",borderRadius:"50%",width:14,height:14,fontSize:9,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center",color:"#1C1C1E"}}>✓</span>}
                          </button>;
                        })}
                      </div>
                    </div>
                  );
                })}
              </div>
            }
            {prefFilter.length>0&&<div style={{marginTop:8,padding:"6px 10px",background:"#4AB8D415",borderRadius:7,border:"1px solid #4AB8D430",fontSize:11,color:"#4AB8D4"}}>{prefFilter.join("・")} で絞り込み中</div>}
          </div>
        )}
      </div>

      {/* 施設タイプフィルター */}
      <div style={{marginBottom:8}}>
        <button onClick={()=>setShowFacilityFilter(v=>!v)}
          style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 14px",background:"#26262c",border:"1px solid "+(facilityFilter!=="all"?"#a07adc":"#35353e"),borderRadius:showFacilityFilter?"10px 10px 0 0":"10px",cursor:"pointer",transition:"all 0.2s"}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <span style={{color:"#8888a0",fontSize:12,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.06em"}}>🏷 施設タイプで絞り込み</span>
            {facilityFilter!=="all"&&<span style={{background:"#a07adc",borderRadius:20,padding:"1px 8px",fontSize:10,color:"#fff",fontWeight:700}}>{FACILITY_TYPES.find(t=>t.key===facilityFilter)?FACILITY_TYPES.find(t=>t.key===facilityFilter).label:""}</span>}
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            {facilityFilter!=="all"&&<button onClick={e=>{e.stopPropagation();setFacilityFilter("all");}} style={{background:"none",border:"none",cursor:"pointer",color:"#5a5a6a",fontSize:11,textDecoration:"underline"}}>リセット</button>}
            <span style={{color:"#5a5a6a",fontSize:12,display:"inline-block",transform:showFacilityFilter?"rotate(180deg)":"rotate(0deg)",transition:"transform 0.2s"}}>▼</span>
          </div>
        </button>
        {showFacilityFilter&&(
          <div style={{background:"#26262c",border:"1px solid #35353e",borderTop:"none",borderRadius:"0 0 10px 10px",padding:"12px 14px"}}>
            <div className="filter-chips">
              <button onClick={()=>setFacilityFilter("all")} className="filter-chip"
                style={{border:facilityFilter==="all"?"1.5px solid #4AB8D4":"1.5px solid #35353e",background:facilityFilter==="all"?"#4AB8D420":"#1C1C1E",color:facilityFilter==="all"?"#4AB8D4":"#5a5a6a"}}>すべて</button>
              {FACILITY_TYPES.map(t=>{
                const active=facilityFilter===t.key;
                return <button key={t.key} onClick={()=>setFacilityFilter(active?"all":t.key)} className="filter-chip"
                  style={{border:active?"1.5px solid #a07adc":"1.5px solid #35353e",background:active?"#a07adc20":"#1C1C1E",color:active?"#a07adc":"#8888a0"}}>
                  {t.icon} {t.label}
                </button>;
              })}
            </div>
          </div>
        )}
      </div>

      {/* 評価項目絞り込み */}
      <div style={{marginBottom:18}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <div style={{color:"#8888a0",fontSize:12,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.06em"}}>重視する項目を選択</div>
          {!isAllMode&&<button onClick={()=>setSelectedKeys([])} style={{background:"none",border:"none",cursor:"pointer",color:"#5a5a6a",fontSize:12,textDecoration:"underline"}}>リセット</button>}
        </div>
        <div style={{marginBottom:8}}>
          <button onClick={()=>setSelectedKeys([])} style={{padding:"7px 14px",borderRadius:20,fontSize:13,fontWeight:600,border:isAllMode?"1.5px solid #4AB8D4":"1.5px solid #35353e",background:isAllMode?"#4AB8D420":"#26262c",color:isAllMode?"#4AB8D4":"#5a5a6a",cursor:"pointer"}}>🏆 総合（全項目）</button>
        </div>
        <div className="filter-chips">
          {CATEGORIES.map(cat=>{
            const active=selectedKeys.includes(cat.key);
            return <button key={cat.key} onClick={()=>toggleKey(cat.key)} className="filter-chip"
              style={{position:"relative",border:active?"1.5px solid #C8956A":"1.5px solid #35353e",background:active?"#C8956A20":"#26262c",color:active?"#C8956A":"#8888a0"}}>
              {cat.icon} {cat.label}
              {active&&<span style={{position:"absolute",top:-5,right:-5,background:"#C8956A",borderRadius:"50%",width:16,height:16,fontSize:10,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center",color:"#1C1C1E"}}>✓</span>}
            </button>;
          })}
        </div>
        {!isAllMode&&<div style={{marginTop:10,padding:"9px 14px",background:"#C8956A15",borderRadius:10,border:"1px solid #C8956A30",fontSize:13,color:"#C8956A"}}>
          <strong>{selectedKeys.map(k=>{const c=CATEGORIES.find(x=>x.key===k);return c?c.label:"";}).join(" + ")}</strong> の平均でランキング中
        </div>}
        <div style={{marginTop:8,padding:"7px 12px",background:"#22222a",borderRadius:8,border:"1px solid #2e2e3a"}}>
          <div style={{color:"#5a5a6a",fontSize:11,lineHeight:1.6}}>
            {isAllMode?"※ 同点の場合は「5」の評価数が多い順　※ 複数評価がある施設は平均値を表示":"※ 同点の場合は総合評価の数値が高い順　※ 複数評価がある施設は平均値を表示"}
          </div>
        </div>
      </div>

      {sorted.length===0
        ?<div style={{textAlign:"center",padding:"60px 20px",color:"#5a5a6a",fontSize:15}}><div style={{fontSize:48,marginBottom:16}}>🔥</div>まだサウナが登録されていません</div>
        :<div style={{display:"flex",flexDirection:"column",gap:10}}>
          {sorted.map((sauna,i)=>{
            const score=customAvg(sauna.scores,isAllMode?null:selectedKeys);
            const isTop=i<3;
            const isExpanded=expandedName===sauna.name;
            const hasAddr=sauna.address&&sauna.address.trim();
            const hasHP=sauna.homepage&&sauna.homepage.trim();
            const isHighlighted=searchResult&&searchResult.name===sauna.name;
            return (
              <div key={sauna.name} ref={el=>itemRefs.current[sauna.name]=el}
                style={{background:isTop?"linear-gradient(135deg,#26262c,#2a2820)":"#26262c",borderRadius:14,border:isHighlighted?"2px solid #4AB8D4":isTop?"1px solid "+medals[i]+"40":"1px solid #2e2e36",overflow:"hidden",transition:"border-color 0.3s"}}>
                <div className="rank-card-inner">
                  <div style={{width:30,height:30,borderRadius:"50%",flexShrink:0,background:isTop?medals[i]+"20":"#1C1C1E",border:"2px solid "+(isTop?medals[i]:"#35353e"),display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:13,color:isTop?medals[i]:"#5a5a6a"}}>{i+1}</div>
                  <div style={{flex:1,minWidth:0}}>
                    <div className="badge-row">
                      <div className="rank-name">{sauna.name}</div>
                      <FacilityTypeBadge typeKey={sauna.facility_type}/>
                      {sauna._count>1&&<span style={{background:"#C8956A20",border:"1px solid #C8956A40",borderRadius:20,padding:"1px 7px",fontSize:10,color:"#C8956A",fontWeight:700,whiteSpace:"nowrap"}}>{sauna._count}人の平均</span>}
                    </div>
                    <div className="cat-scores">
                      {CATEGORIES.map(cat=>{
                        const isSel=selectedKeys.includes(cat.key);
                        const val=sauna.scores[cat.key];
                        return <span key={cat.key} className="cat-score-item" style={{color:!isAllMode&&isSel?"#C8956A":"#5a5a6a",fontWeight:!isAllMode&&isSel?700:400}}>
                          {cat.icon}{typeof val==="number"?val.toFixed(sauna._count>1?1:0):"—"}
                        </span>;
                      })}
                    </div>
                    <div style={{display:"flex",alignItems:"center",gap:6,marginTop:3,flexWrap:"wrap"}}>
                      {sauna.prefecture&&<span style={{background:"#1a2a3a",border:"1px solid #2a4a6a",borderRadius:20,padding:"1px 8px",fontSize:10,color:"#4AB8D4",fontWeight:600,whiteSpace:"nowrap"}}>📍 {sauna.prefecture}</span>}
                      {hasAddr&&<div style={{color:"#5a5a6a",fontSize:11,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flex:1}}>{sauna.address}</div>}
                    </div>
                  </div>
                  <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2,flexShrink:0}}>
                    <ScoreCircle value={score} size={48}/>
                    {!isAllMode&&<div style={{fontSize:9,color:"#8888a0",textAlign:"center"}}>総合{avg(sauna.scores).toFixed(1)}</div>}
                  </div>
                  <button onClick={()=>setExpandedName(isExpanded?null:sauna.name)}
                    style={{background:"#1C1C1E",border:"1px solid #35353e",borderRadius:7,padding:"6px 8px",color:"#8888a0",fontSize:13,cursor:"pointer",flexShrink:0}}>
                    {isExpanded?"▲":"▼"}
                  </button>
                </div>

                {isExpanded&&(
                  <div style={{borderTop:"1px solid #2e2e36",background:"#1a1a20"}}>
                    <div style={{padding:"12px 15px",display:"flex",gap:8,flexWrap:"wrap"}}>
                      <button onClick={()=>openMap(sauna.address,sauna.name)}
                        style={{flex:1,minWidth:120,padding:"9px 12px",background:"#1a2a3a",border:"1px solid #2a4a6a",borderRadius:8,color:"#4AB8D4",fontSize:13,fontWeight:700,cursor:"pointer"}}>
                        📍 Google マップで開く
                      </button>
                      {hasHP&&<a href={sauna.homepage} target="_blank"
                        style={{flex:1,minWidth:120,padding:"9px 12px",background:"#1a2a1a",border:"1px solid #2a5a2a",borderRadius:8,color:"#5adf9a",fontSize:13,fontWeight:700,cursor:"pointer",textDecoration:"none",display:"flex",alignItems:"center",justifyContent:"center"}}>
                        🌐 公式HP
                      </a>}
                    </div>
                    <div style={{padding:"4px 15px 14px"}}>
                      <div style={{color:"#5a5a6a",fontSize:11,fontWeight:600,letterSpacing:"0.06em",textTransform:"uppercase",marginBottom:10}}>
                        {sauna._count>1?"各評価者の詳細":"評価の詳細"}
                      </div>
                      {isAdmin&&(
                        <div style={{marginBottom:10}}>
                          {confirmFacDel===sauna.name
                            ?<div style={{display:"flex",gap:8}}>
                              <button onClick={()=>{onDeleteFacility(sauna.name);setConfirmFacDel(null);}} style={{flex:1,padding:"9px",background:"#3a1a1a",border:"1px solid #5a2020",borderRadius:8,color:"#e05858",fontSize:12,fontWeight:700,cursor:"pointer"}}>本当に削除する（{sauna._count}件・元に戻せません）</button>
                              <button onClick={()=>setConfirmFacDel(null)} style={{padding:"9px 14px",background:"#26262c",border:"1px solid #35353e",borderRadius:8,color:"#8888a0",fontSize:12,cursor:"pointer"}}>やめる</button>
                            </div>
                            :<button onClick={()=>setConfirmFacDel(sauna.name)} style={{width:"100%",padding:"8px",background:"#2a1a1a",border:"1px solid #3a2020",borderRadius:8,color:"#c07070",fontSize:12,fontWeight:600,cursor:"pointer"}}>🛡️ この施設の全評価を削除（管理者）</button>}
                        </div>
                      )}
                      {sauna._entries.map((entry,ei)=>(
                        <div key={entry.id} style={{background:"#22222a",borderRadius:10,border:"1px solid #2e2e36",marginBottom:8,overflow:"hidden"}}>
                          <div className="entry-header">
                            <div className="entry-meta">
                              <span className="entry-author">👤 {entry.author||"匿名"}</span>
                              <span className="entry-total">総合 {avg(entry.scores).toFixed(1)}</span>
                              <span className="entry-date">{new Date(entry.created_at).toLocaleDateString("ja-JP")}</span>
                            </div>
                            <div className="entry-actions">
                              {isMine(entry)&&<button onClick={()=>setEditingEntry(entry)} className="entry-edit-btn">✏️ 編集</button>}
                              {(isMine(entry)||isAdmin)&&(confirmDelete===entry.id
                                ?<button onClick={()=>{onDelete(entry.id);setConfirmDelete(null);}} className="entry-confirm-btn">確認</button>
                                :<button onClick={()=>setConfirmDelete(entry.id)} className="entry-del-btn">{isMine(entry)?"🗑️":"🛡️🗑️"}</button>)}
                            </div>
                          </div>
                          <div style={{padding:"10px 14px"}}>
                            {entry.visit_time&&(
                              <div style={{marginBottom:8,display:"flex",alignItems:"center",gap:5}}>
                                <span style={{color:"#5a5a6a",fontSize:10}}>訪問時間帯：</span>
                                <span style={{background:"#2a2a3a",border:"1px solid #3a3a50",borderRadius:20,padding:"2px 8px",fontSize:10,color:"#9a9ab8",fontWeight:600}}>🕐 {TIME_SLOTS.find(t=>t.key===entry.visit_time)?.label}</span>
                              </div>
                            )}
                            <div className="score-grid">
                              {CATEGORIES.map(cat=>(
                                <div key={cat.key} className="score-row">
                                  <span className="score-row-label">{cat.icon} {cat.label}</span>
                                  <div className="score-row-right">
                                    <StarDisplay value={entry.scores[cat.key]||0}/>
                                    <span className="score-row-num" style={{color:entry.scores[cat.key]>=4?"#4AB8D4":entry.scores[cat.key]>=3?"#C8956A":"#e05858"}}>
                                      {entry.scores[cat.key]||"—"}
                                    </span>
                                  </div>
                                </div>
                              ))}
                            </div>
                            {entry.note&&<div style={{marginTop:8,padding:"6px 10px",background:"#1a1a22",borderRadius:6,color:"#5a5a6a",fontSize:12,lineHeight:1.5}}>💬 {entry.note}</div>}
                            <CommentSection entry={entry} comments={comments||[]} currentUser={currentUser} onAdd={onAddComment} onDelete={onDeleteComment} autoOpen={!!focus&&focus.entryId===entry.id}/>
                          </div>
                        </div>
                      ))}
                      {sauna._count>1&&(
                        <div style={{background:"#1a2a2a",borderRadius:10,border:"1px solid #2a4a4a",overflow:"hidden"}}>
                          <div style={{padding:"9px 14px",borderBottom:"1px solid #2a4a4a",display:"flex",alignItems:"center",gap:8}}>
                            <span style={{color:"#4AB8D4",fontSize:13,fontWeight:700}}>📊 {sauna._count}人の平均</span>
                            <span style={{background:"#4AB8D430",borderRadius:20,padding:"2px 10px",color:"#4AB8D4",fontSize:12,fontWeight:700}}>総合 {avg(sauna.scores).toFixed(1)}</span>
                          </div>
                          <div style={{padding:"10px 14px"}}>
                            <div className="score-grid">
                              {CATEGORIES.map(cat=>(
                                <div key={cat.key} className="score-row">
                                  <span className="score-row-label">{cat.icon} {cat.label}</span>
                                  <span className="score-row-num" style={{color:"#4AB8D4"}}>{typeof sauna.scores[cat.key]==="number"?sauna.scores[cat.key].toFixed(1):"—"}</span>
                                </div>
                              ))}
                            </div>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      }
    </div>
  );
}

function MyPage({ currentUser, saunas, onLogout, onUpdateEntry, onDelete, onRename, onClaim, saving, comments, onAddComment, onDeleteComment }) {
  // 自分の評価（user_id 一致 or author 一致）
  const mySaunas = saunas.filter(s => s.user_id === currentUser.id || s.author === currentUser.name);
  const facilityCount = new Set(mySaunas.map(s=>s.name)).size;
  const totalAvg = mySaunas.length > 0
    ? (mySaunas.reduce((sum,s)=>sum+avg(s.scores),0)/mySaunas.length).toFixed(1) : "—";

  const [tab,          setTab]          = useState("list"); // list | settings
  const [searchQ,      setSearchQ]      = useState("");
  const [sortBy,       setSortBy]       = useState("date"); // date | score
  const [confirmDel,   setConfirmDel]   = useState(null);
  const [editingEntry, setEditingEntry] = useState(null);
  // 名前変更
  const [newName,      setNewName]      = useState(currentUser.name);
  const [nameError,    setNameError]    = useState("");
  // 紐付け
  const [claimName,    setClaimName]    = useState("");
  const [claimError,   setClaimError]   = useState("");
  // お気に入り（localStorage）
  const [favorites,    setFavorites]    = useState(()=>{
    try{return JSON.parse(localStorage.getItem("totonlog_fav_"+currentUser.id)||"[]");}catch{return[];}
  });
  const toggleFav = (name) => {
    const next = favorites.includes(name) ? favorites.filter(f=>f!==name) : [...favorites,name];
    setFavorites(next);
    try{localStorage.setItem("totonlog_fav_"+currentUser.id,JSON.stringify(next));}catch{}
  };

  // 検索・ソート
  const filtered = mySaunas
    .filter(s => !searchQ.trim() || s.name.toLowerCase().includes(searchQ.trim().toLowerCase()))
    .sort((a,b) => sortBy==="score" ? avg(b.scores)-avg(a.scores) : b.created_at.localeCompare(a.created_at));

  const favSaunas = [...new Set(favorites)].filter(f => saunas.some(s=>s.name===f));

  const iStyle = {width:"100%",background:"#26262c",border:"1.5px solid #35353e",borderRadius:8,padding:"10px 12px",color:"#E8EDF2",fontSize:16,outline:"none"};

  return (
    <div className="rp-container">
      {editingEntry&&(
        <EditEntryModal entry={editingEntry}
          onSave={async(id,data)=>{await onUpdateEntry(id,data);setEditingEntry(null);}}
          onSaveFacility={async()=>{setEditingEntry(null);}}
          onClose={()=>setEditingEntry(null)} saving={saving}/>
      )}

      {/* プロフィールカード */}
      <div style={{background:"linear-gradient(135deg,#1a2a3a,#1a1a2a)",border:"1px solid #2a4a6a",borderRadius:16,padding:"18px 16px",marginBottom:16}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14}}>
          <div style={{width:50,height:50,borderRadius:"50%",background:"linear-gradient(135deg,#4AB8D4,#2e8fa8)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,fontWeight:800,color:"#fff",flexShrink:0}}>
            {currentUser.name.charAt(0)}
          </div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:18,fontWeight:800,color:"#E8EDF2",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{currentUser.name}</div>
            <div style={{color:"#5a5a6a",fontSize:11,marginTop:1}}>サウナー</div>
          </div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
          {[{label:"制覇施設数",value:facilityCount+"施設"},{label:"評価件数",value:mySaunas.length+"件"},{label:"平均スコア",value:totalAvg}].map(stat=>(
            <div key={stat.label} style={{background:"#1C1C1E",borderRadius:10,padding:"10px 6px",textAlign:"center"}}>
              <div style={{color:"#4AB8D4",fontSize:16,fontWeight:800}}>{stat.value}</div>
              <div style={{color:"#5a5a6a",fontSize:9,marginTop:2}}>{stat.label}</div>
            </div>
          ))}
        </div>
      </div>

      {/* タブ */}
      <div style={{display:"flex",background:"#26262c",borderRadius:10,padding:3,marginBottom:16,gap:3}}>
        {[{key:"list",label:"📋 評価一覧"},{key:"fav",label:"⭐ お気に入り"},{key:"settings",label:"⚙️ 設定"}].map(t=>(
          <button key={t.key} onClick={()=>setTab(t.key)}
            style={{flex:1,padding:"8px 2px",fontSize:11,fontWeight:700,border:"none",cursor:"pointer",borderRadius:8,transition:"all 0.15s",
              background:tab===t.key?"#4AB8D4":"transparent",color:tab===t.key?"#1C1C1E":"#5a5a6a"}}>
            {t.label}
          </button>
        ))}
      </div>

      {/* ── 評価一覧タブ ── */}
      {tab==="list"&&(
        <div>
          {/* 検索・絞り込み */}
          <div style={{display:"flex",gap:8,marginBottom:12}}>
            <div style={{flex:1,position:"relative"}}>
              <span style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",fontSize:13,pointerEvents:"none"}}>🔍</span>
              <input value={searchQ} onChange={e=>setSearchQ(e.target.value)} placeholder="施設名で検索…"
                style={{width:"100%",background:"#26262c",border:"1.5px solid #35353e",borderRadius:8,padding:"9px 12px 9px 30px",color:"#E8EDF2",fontSize:16,outline:"none"}}/>
            </div>
            <select value={sortBy} onChange={e=>setSortBy(e.target.value)}
              style={{background:"#26262c",border:"1.5px solid #35353e",borderRadius:8,padding:"9px 10px",color:"#E8EDF2",fontSize:13,outline:"none",cursor:"pointer",flexShrink:0}}>
              <option value="date">新しい順</option>
              <option value="score">スコア順</option>
            </select>
          </div>
          <div style={{color:"#5a5a6a",fontSize:11,marginBottom:10}}>{filtered.length}件</div>

          {filtered.length===0
            ?<div style={{textAlign:"center",padding:"40px 20px",color:"#5a5a6a"}}><div style={{fontSize:36,marginBottom:8}}>🔥</div>評価がありません</div>
            :<div style={{display:"flex",flexDirection:"column",gap:8}}>
              {filtered.map(entry=>(
                <div key={entry.id} style={{background:"#26262c",borderRadius:12,border:"1px solid #2e2e36",overflow:"hidden"}}>
                  <div style={{padding:"10px 13px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}>
                    <div style={{minWidth:0,flex:1}}>
                      <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                        <span style={{color:"#E8EDF2",fontWeight:700,fontSize:14,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{entry.name}</span>
                        <button onClick={()=>toggleFav(entry.name)}
                          style={{background:"none",border:"none",cursor:"pointer",fontSize:14,padding:0,flexShrink:0}}>
                          {favorites.includes(entry.name)?"⭐":"☆"}
                        </button>
                      </div>
                      <div style={{display:"flex",alignItems:"center",gap:5,marginTop:3,flexWrap:"wrap"}}>
                        <span style={{background:"#1C1C1E",borderRadius:20,padding:"1px 7px",color:"#4AB8D4",fontSize:10,fontWeight:700}}>総合 {avg(entry.scores).toFixed(1)}</span>
                        <span style={{color:"#45454e",fontSize:10}}>{new Date(entry.created_at).toLocaleDateString("ja-JP")}</span>
                        {entry.visit_time&&<span style={{background:"#2a2a3a",border:"1px solid #3a3a50",borderRadius:20,padding:"1px 6px",fontSize:9,color:"#8888a0"}}>🕐 {TIME_SLOTS.find(t=>t.key===entry.visit_time)?.label}</span>}
                      </div>
                    </div>
                    <div style={{display:"flex",gap:4,flexShrink:0}}>
                      <button onClick={()=>setEditingEntry(entry)} className="entry-edit-btn">✏️</button>
                      {confirmDel===entry.id
                        ?<button onClick={()=>{onDelete(entry.id);setConfirmDel(null);}} className="entry-confirm-btn">確認</button>
                        :<button onClick={()=>setConfirmDel(entry.id)} className="entry-del-btn">🗑️</button>}
                    </div>
                  </div>
                  <div style={{padding:"6px 13px 10px",borderTop:"1px solid #2e2e36"}}>
                    <div className="score-grid">
                      {CATEGORIES.map(cat=>(
                        <div key={cat.key} className="score-row">
                          <span className="score-row-label">{cat.icon} {cat.label}</span>
                          <div className="score-row-right">
                            <StarDisplay value={entry.scores[cat.key]||0}/>
                            <span className="score-row-num" style={{color:entry.scores[cat.key]>=4?"#4AB8D4":entry.scores[cat.key]>=3?"#C8956A":"#e05858"}}>{entry.scores[cat.key]||"—"}</span>
                          </div>
                        </div>
                      ))}
                    </div>
                    {entry.note&&<div style={{marginTop:6,padding:"5px 8px",background:"#1a1a22",borderRadius:5,color:"#5a5a6a",fontSize:12}}>💬 {entry.note}</div>}
                    <CommentSection entry={entry} comments={comments||[]} currentUser={currentUser} onAdd={onAddComment} onDelete={onDeleteComment}/>
                  </div>
                </div>
              ))}
            </div>
          }
        </div>
      )}

      {/* ── お気に入りタブ ── */}
      {tab==="fav"&&(
        <div>
          <div style={{color:"#8888a0",fontSize:11,marginBottom:12}}>⭐ をタップして施設をお気に入り登録できます（評価一覧から）</div>
          {favSaunas.length===0
            ?<div style={{textAlign:"center",padding:"40px 20px",color:"#5a5a6a"}}><div style={{fontSize:36,marginBottom:8}}>⭐</div>お気に入りがありません</div>
            :<div style={{display:"flex",flexDirection:"column",gap:8}}>
              {favSaunas.map(name=>{
                const entries = saunas.filter(s=>s.name===name);
                const grouped = groupByFacility(entries);
                const g = grouped[0];
                if(!g) return null;
                const score = avg(g.scores);
                return (
                  <div key={name} style={{background:"#26262c",borderRadius:12,border:"1px solid #2e2e36",padding:"12px 14px",display:"flex",alignItems:"center",gap:12}}>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{color:"#E8EDF2",fontWeight:700,fontSize:14,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{name}</div>
                      <div style={{display:"flex",alignItems:"center",gap:5,marginTop:4,flexWrap:"wrap"}}>
                        {g.prefecture&&<span style={{background:"#1a2a3a",border:"1px solid #2a4a6a",borderRadius:20,padding:"1px 7px",fontSize:10,color:"#4AB8D4"}}>📍 {g.prefecture}</span>}
                        <FacilityTypeBadge typeKey={g.facility_type}/>
                      </div>
                    </div>
                    <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
                      <ScoreCircle value={score} size={44}/>
                      <button onClick={()=>toggleFav(name)} style={{background:"none",border:"none",cursor:"pointer",fontSize:18,padding:0}}>⭐</button>
                    </div>
                  </div>
                );
              })}
            </div>
          }
        </div>
      )}

      {/* ── 設定タブ ── */}
      {tab==="settings"&&(
        <div style={{display:"flex",flexDirection:"column",gap:16}}>

          {/* 名前変更 */}
          <div style={{background:"#26262c",borderRadius:12,border:"1px solid #2e2e36",padding:"14px"}}>
            <div style={{color:"#E8EDF2",fontWeight:700,fontSize:14,marginBottom:10}}>✏️ 名前を変更</div>
            <div style={{color:"#5a5a6a",fontSize:11,marginBottom:10,lineHeight:1.6}}>名前を変えると、紐付けられた全ての評価データの投稿者名も自動で変更されます</div>
            <input value={newName} onChange={e=>setNewName(e.target.value)} style={{...iStyle,marginBottom:8}}/>
            {nameError&&<div style={{color:"#e05858",fontSize:12,marginBottom:8}}>{nameError}</div>}
            <button onClick={async()=>{
              if(!newName.trim()){setNameError("名前を入力してください");return;}
              if(newName.trim()===currentUser.name){setNameError("現在と同じ名前です");return;}
              setNameError("");
              await onRename(newName.trim());

            {claimError&&<div style={{color:"#e05858",fontSize:12,marginBottom:8}}>{claimError}</div>}

              style={{width:"100%",padding:"11px",background:saving?"#2a2a2e":"#1a2a3a",border:"1px solid #2a4a6a",borderRadius:8,color:saving?"#5a5a6a":"#4AB8D4",fontSize:14,fontWeight:700,cursor:saving?"not-allowed":"pointer"}}>
              {saving?"処理中…":"この名前の評価を紐付ける"}

          {/* ログアウト */}
          <div style={{background:"#26262c",borderRadius:12,border:"1px solid #2e2e36",padding:"14px"}}>

            <button onClick={onLogout}
              style={{width:"100%",padding:"11px",background:"#2a1a1a",border:"1px solid #5a2a2a",borderRadius:8,color:"#e05858",fontSize:14,fontWeight:700,cursor:"pointer"}}>
              ログアウト

  );
}

let _gmapsPromise = null;
function loadGoogleMaps() {
  if (window.google && window.google.maps && window.google.maps.importLibrary) return Promise.resolve();
  if (_gmapsPromise) return _gmapsPromise;
  _gmapsPromise = new Promise((resolve, reject) => {
    window.__gmapsReady = () => resolve();
    window.gm_authFailure = () => { if (window.__gmapsAuthCb) window.__gmapsAuthCb(); };
    const s = document.createElement("script");
    s.src = "https://maps.googleapis.com/maps/api/js?key=" + GOOGLE_API_KEY + "&loading=async&callback=__gmapsReady&language=ja&region=JP&v=weekly";
    s.async = true;
    s.onerror = () => { _gmapsPromise = null; reject(new Error("Googleマップの読み込みに失敗しました")); };
    document.head.appendChild(s);
  });
  return _gmapsPromise;
}

function escHtml(t) {
  return String(t == null ? "" : t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function pinColor(v) { return v >= 4 ? "#2e8fa8" : v >= 3 ? "#d9822b" : "#d64545"; }

function makePinClass() {
  const G = window.google.maps;
  function Pin(position, html, onClick) {
    G.OverlayView.call(this);
    this.position = position; this.html = html; this.onClick = onClick; this.div = null;
  }
  Pin.prototype = Object.create(G.OverlayView.prototype);
  Pin.prototype.constructor = Pin;
  Pin.prototype.onAdd = function () {
    const d = document.createElement("div");
    d.style.position = "absolute";
    d.style.cursor = "pointer";
    d.style.transform = "translate(-50%,-100%)";
    d.innerHTML = this.html;
    const self = this;
    d.addEventListener("click", function (e) { e.stopPropagation(); if (self.onClick) self.onClick(); });
    this.div = d;
    this.getPanes().overlayMouseTarget.appendChild(d);
    if (this._active) this.setActive(true);
  };
  Pin.prototype.draw = function () {
    const p = this.getProjection();
    if (!p || !this.div) return;
    const pt = p.fromLatLngToDivPixel(this.position);
    if (pt) { this.div.style.left = pt.x + "px"; this.div.style.top = pt.y + "px"; }
  };
  Pin.prototype.onRemove = function () {
    if (this.div && this.div.parentNode) this.div.parentNode.removeChild(this.div);
    this.div = null;
  };
  Pin.prototype.setActive = function (on) {
    this._active = on;
    if (!this.div) return;
    this.div.style.zIndex = on ? "999" : "";
    this.div.firstChild.style.transform = on ? "scale(1.25)" : "";
    this.div.firstChild.style.transformOrigin = "50% 100%";
    this.div.firstChild.style.transition = "transform 0.15s";
  };
  return Pin;
}

function buildPinHtml(g, score) {
  const c = pinColor(score);
  return '<div style="display:flex;flex-direction:column;align-items:center;">'
    + '<div style="background:' + c + ';color:#fff;border:2px solid #fff;border-radius:16px;padding:3px 9px;font-weight:800;font-size:13px;line-height:1.2;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.45);">'
    + '<span style="font-size:11px;opacity:.9;margin-right:3px;">サ</span>' + score.toFixed(1) + '</div>'
    + '<div style="width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid ' + c + ';margin-top:-1px;"></div>'
    + '<div class="pin-name" style="margin-top:2px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:700;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000,0 0 3px #000;">' + escHtml(g.name) + '</div>'
    + '</div>';
}

function MapPage({ saunas, onBackfill }) {
  const mapDivRef   = useRef(null);
  const mapRef      = useRef(null);
  const pinsRef     = useRef([]);
  const PinRef      = useRef(null);
  const meRef       = useRef(null);
  const fittedRef   = useRef(false);
  const [ready,       setReady]       = useState(false);
  const [mapError,    setMapError]    = useState("");
  const [facilityFilter, setFacilityFilter] = useState("all");
  const [prefFilter,  setPrefFilter]  = useState("");
  const [selectedName,setSelectedName]= useState(null);
  const [backfilling, setBackfilling] = useState(false);
  const [progress,    setProgress]    = useState("");
  const [locMsg,      setLocMsg]      = useState("");

  const grouped = groupByFacility(saunas);
  const withLoc = grouped.filter(g => typeof g.lat === "number" && typeof g.lng === "number");
  const noLoc   = grouped.filter(g => !(typeof g.lat === "number" && typeof g.lng === "number"));
  const availablePrefs = [...new Set(withLoc.map(g => g.prefecture).filter(Boolean))].sort((a, b) => PREFS_LIST.indexOf(a) - PREFS_LIST.indexOf(b));
  const shown = withLoc
    .filter(g => facilityFilter === "all" || g.facility_type === facilityFilter)
    .filter(g => !prefFilter || g.prefecture === prefFilter);
  const pointsKey = shown.map(g => g.name + "|" + g.lat + "|" + g.lng + "|" + avg(g.scores).toFixed(2)).join(";;");
  const selected = selectedName ? grouped.find(g => g.name === selectedName) : null;

  // 地図の読み込み
  useEffect(() => {
    let cancelled = false;
    window.__gmapsAuthCb = () => setMapError("Googleマップの認証に失敗しました。Google Cloudで「Maps JavaScript API」を有効にし、APIキーの制限に追加してください。");
    loadGoogleMaps().then(async () => {
      if (cancelled) return;
      const { Map } = await window.google.maps.importLibrary("maps");
      if (cancelled || !mapDivRef.current) return;
      const map = new Map(mapDivRef.current, {
        center: { lat: 36.2, lng: 138.25 }, zoom: 5,
        disableDefaultUI: true, zoomControl: false, gestureHandling: "greedy",
        clickableIcons: false, backgroundColor: "#1C1C1E",
        styles: [
          { elementType: "geometry", stylers: [{ color: "#1d2630" }] },
          { elementType: "labels.text.fill", stylers: [{ color: "#8a99a8" }] },
          { elementType: "labels.text.stroke", stylers: [{ color: "#1d2630" }] },
          { featureType: "road", elementType: "geometry", stylers: [{ color: "#2c3846" }] },
          { featureType: "water", elementType: "geometry", stylers: [{ color: "#0f1a24" }] },
          { featureType: "poi", stylers: [{ visibility: "off" }] },
          { featureType: "transit", stylers: [{ visibility: "off" }] },
        ],
      });
      map.addListener("click", () => setSelectedName(null));
      const applyZoomClass = () => {
        const z = map.getZoom() || 5;
        if (mapDivRef.current) mapDivRef.current.classList.toggle("zoom-low", z < 11);
      };
      map.addListener("zoom_changed", applyZoomClass);
      applyZoomClass();
      PinRef.current = makePinClass();
      mapRef.current = map;
      setReady(true);
    }).catch(e => { if (!cancelled) setMapError(e.message); });
    return () => {
      cancelled = true;
      pinsRef.current.forEach(p => p.setMap(null)); pinsRef.current = [];
      if (meRef.current) { meRef.current.setMap(null); meRef.current = null; }
      mapRef.current = null; fittedRef.current = false;
    };
  }, []);

  // ピンの描画（データが変わった時だけ作り直す）
  useEffect(() => {
    if (!ready || !mapRef.current || !PinRef.current) return;
    const map = mapRef.current, Pin = PinRef.current, G = window.google.maps;
    pinsRef.current.forEach(p => p.setMap(null));
    pinsRef.current = shown.map(g => {
      const pin = new Pin(new G.LatLng(g.lat, g.lng), buildPinHtml(g, avg(g.scores)), () => setSelectedName(g.name));
      pin._name = g.name;
      pin._active = (g.name === selectedName);
      pin.setMap(map);
      return pin;
    });
    if (shown.length > 0 && !fittedRef.current) { fitAll(); fittedRef.current = true; }
  }, [ready, pointsKey]);

  // 選択中のピンを強調
  useEffect(() => {
    pinsRef.current.forEach(p => p.setActive(p._name === selectedName));
  }, [selectedName, pointsKey, ready]);

  // フィルタが変わったら全体表示にフィットし直す
  useEffect(() => { if (ready) { fitAll(); setSelectedName(null); } }, [facilityFilter, prefFilter]);

  function fitAll() {
    const map = mapRef.current; if (!map || shown.length === 0) return;
    const G = window.google.maps;
    if (shown.length === 1) { map.setCenter({ lat: shown[0].lat, lng: shown[0].lng }); map.setZoom(14); return; }
    const b = new G.LatLngBounds();
    shown.forEach(g => b.extend({ lat: g.lat, lng: g.lng }));
    map.fitBounds(b, 60);
  }

  function goMyLocation() {
    if (!navigator.geolocation) { setLocMsg("このブラウザでは現在地を取得できません"); return; }
    setLocMsg("現在地を取得中…");
    navigator.geolocation.getCurrentPosition(pos => {
      const map = mapRef.current; if (!map) return;
      const G = window.google.maps;
      const ll = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      map.panTo(ll); map.setZoom(13);
      if (meRef.current) meRef.current.setMap(null);
      meRef.current = new G.Marker({ position: ll, map, zIndex: 1,
        icon: { path: G.SymbolPath.CIRCLE, scale: 8, fillColor: "#4285F4", fillOpacity: 1, strokeColor: "#fff", strokeWeight: 3 } });
      setLocMsg("");
    }, () => setLocMsg("現在地を取得できませんでした（位置情報の許可を確認してください）"),
    { enableHighAccuracy: true, timeout: 10000 });
  }

  async function runBackfill() {
    if (backfilling) return;
    setBackfilling(true); setProgress("準備中…");
    try {
      const r = await onBackfill((done, total) => setProgress(done + " / " + total + " 件処理中…"));
      setProgress("完了：" + r.ok + "件取得" + (r.ng > 0 ? "／" + r.ng + "件は見つかりませんでした" : ""));
    } catch (e) { setProgress("エラー: " + e.message); }
    finally { setBackfilling(false); }
  }

  function openGMap(g) {
    const q = g.address ? g.name + " " + g.address : g.name;
    window.open("https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q), "_blank");
  }

  const fabStyle = { width: 44, height: 44, borderRadius: "50%", background: "#26262c", border: "1px solid #35353e", color: "#E8EDF2", fontSize: 20, cursor: "pointer", boxShadow: "0 2px 8px rgba(0,0,0,.5)", display: "flex", alignItems: "center", justifyContent: "center" };
  const chip = on => ({ padding: "6px 11px", borderRadius: 20, fontSize: 12, fontWeight: 600, cursor: "pointer", whiteSpace: "nowrap", border: "1px solid " + (on ? "#4AB8D4" : "#35353e"), background: on ? "#1a2a3a" : "#26262c", color: on ? "#4AB8D4" : "#8888a0" });

  return (
    <div style={{ maxWidth: 900, margin: "0 auto", width: "100%" }}>
      {/* フィルタ */}
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center", marginBottom: 8 }}>
        <button style={chip(facilityFilter === "all")} onClick={() => setFacilityFilter("all")}>すべて</button>
        {FACILITY_TYPES.map(t => (
          <button key={t.key} style={chip(facilityFilter === t.key)} onClick={() => setFacilityFilter(t.key)}>{t.icon} {t.label}</button>
        ))}
        {availablePrefs.length > 0 && (
          <select value={prefFilter} onChange={e => setPrefFilter(e.target.value)}
            style={{ background: "#26262c", border: "1px solid #35353e", borderRadius: 20, padding: "5px 10px", color: prefFilter ? "#4AB8D4" : "#8888a0", fontSize: 16, outline: "none", maxWidth: 150 }}>
            <option value="">📍 全国</option>
            {availablePrefs.map(p => <option key={p} value={p}>{p}</option>)}
          </select>
        )}
      </div>

      {/* 位置情報未取得バナー */}
      {noLoc.length > 0 && (
        <div style={{ background: "#2a2418", border: "1px solid #5a4a20", borderRadius: 10, padding: "9px 12px", marginBottom: 8, display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
          <div style={{ flex: 1, minWidth: 160, fontSize: 12, color: "#d9b46a", lineHeight: 1.5 }}>
            {noLoc.length}施設の位置情報が未取得です{progress && <div style={{ color: "#9a9ab8", marginTop: 2 }}>{progress}</div>}
          </div>
          <button onClick={runBackfill} disabled={backfilling}
            style={{ padding: "8px 14px", background: backfilling ? "#35353e" : "linear-gradient(135deg,#4AB8D4,#2e8fa8)", border: "none", borderRadius: 8, color: "#fff", fontSize: 13, fontWeight: 700, cursor: backfilling ? "default" : "pointer", whiteSpace: "nowrap" }}>
            {backfilling ? "取得中…" : "📍 一括取得"}
          </button>
        </div>
      )}
      {noLoc.length === 0 && progress && <div style={{ fontSize: 12, color: "#5adf9a", marginBottom: 8 }}>{progress}</div>}

      {/* 地図 */}
      <div style={{ position: "relative", borderRadius: 14, overflow: "hidden", border: "1px solid #2e2e36" }}>
        <div ref={mapDivRef} className="map-box" style={{ width: "100%", background: "#1d2630" }}/>
        {!ready && !mapError && <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", color: "#5a5a6a", fontSize: 14 }}>地図を読み込み中…</div>}
        {mapError && (
          <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", padding: 20, background: "#1C1C1E" }}>
            <div style={{ color: "#e08888", fontSize: 13, lineHeight: 1.7, textAlign: "center" }}>⚠️ {mapError}</div>
          </div>
        )}
        {ready && withLoc.length === 0 && noLoc.length === 0 && (
          <div style={{ position: "absolute", top: 12, left: 12, right: 12, background: "#26262ccc", borderRadius: 10, padding: "8px 12px", fontSize: 12, color: "#9a9ab8", textAlign: "center" }}>まだ施設が登録されていません</div>
        )}
        {ready && (
          <div style={{ position: "absolute", right: 10, top: 10, display: "flex", flexDirection: "column", gap: 8 }}>
            <button style={fabStyle} onClick={goMyLocation} title="現在地">🎯</button>
            <button style={fabStyle} onClick={fitAll} title="全体表示">🗺</button>
          </div>
        )}
        {locMsg && <div style={{ position: "absolute", left: 10, top: 10, right: 64, background: "#26262ce6", borderRadius: 8, padding: "6px 10px", fontSize: 11, color: "#c8c8d8" }}>{locMsg}</div>}

        {/* 選択カード */}
        {selected && (
          <div style={{ position: "absolute", left: 10, right: 10, bottom: 10, background: "#26262c", border: "1px solid #35353e", borderRadius: 14, padding: "12px 12px 10px", boxShadow: "0 4px 16px rgba(0,0,0,.6)" }}>
            <button onClick={() => setSelectedName(null)} style={{ position: "absolute", top: 6, right: 8, background: "none", border: "none", color: "#8888a0", fontSize: 18, cursor: "pointer", lineHeight: 1, padding: 4 }}>✕</button>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <div style={{ flex: 1, minWidth: 0, paddingRight: 18 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap", marginBottom: 3 }}>
                  <div style={{ color: "#E8EDF2", fontWeight: 700, fontSize: 15, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", maxWidth: "100%" }}>{selected.name}</div>
                  <FacilityTypeBadge typeKey={selected.facility_type}/>
                </div>
                <div className="cat-scores">
                  {CATEGORIES.map(cat => {
                    const val = selected.scores[cat.key];
                    return <span key={cat.key} className="cat-score-item" style={{ color: "#8888a0" }}>{cat.icon}{typeof val === "number" ? val.toFixed(selected._count > 1 ? 1 : 0) : "—"}</span>;
                  })}
                </div>
                {selected.address && <div style={{ color: "#5a5a6a", fontSize: 11, marginTop: 4, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>📍 {selected.address}</div>}
                <div style={{ color: "#5a5a6a", fontSize: 10, marginTop: 2 }}>{selected._count}件の評価</div>
              </div>
              <ScoreCircle value={avg(selected.scores)} size={56}/>
            </div>
            <div style={{ display: "flex", gap: 8, marginTop: 9 }}>
              <button onClick={() => openGMap(selected)} style={{ flex: 1, padding: "8px 6px", background: "#1a2a3a", border: "1px solid #2a4a6a", borderRadius: 8, color: "#4AB8D4", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>📍 Googleマップ</button>
              {selected.homepage && selected.homepage.trim() && (
                <a href={selected.homepage} target="_blank" style={{ flex: 1, padding: "8px 6px", background: "#1a2a1a", border: "1px solid #2a5a2a", borderRadius: 8, color: "#5adf9a", fontSize: 12, fontWeight: 700, textDecoration: "none", textAlign: "center" }}>🌐 公式HP</a>
              )}
            </div>
          </div>
        )}
      </div>
      <div style={{ fontSize: 11, color: "#5a5a6a", marginTop: 8, textAlign: "center" }}>
        {shown.length}施設を表示中 ・ ピンの数字は総合評価（青 4.0〜 / 橙 3.0〜 / 赤 3.0未満）
      </div>
    </div>
  );
}

async function apiGetList(url) {
  const res = await fetch(url, { headers: DB_HEADERS });
  if (!res.ok) throw new Error(res.status + ": " + await res.text());
  return res.json();
}
async function apiInsertRow(url, row) {
  const res = await fetch(url, { method: "POST", headers: DB_HEADERS, body: JSON.stringify(row) });
  if (!res.ok) throw new Error(res.status + ": " + await res.text());
  return res.json();
}
async function apiDeleteRow(url, id) {
  const res = await fetch(url + "?id=eq." + encodeURIComponent(id), { method: "DELETE", headers: DB_HEADERS });
  if (!res.ok) throw new Error(res.status + ": " + await res.text());
}
async function apiPatchWhere(url, query, row) {
  const res = await fetch(url + "?" + query, { method: "PATCH", headers: DB_HEADERS, body: JSON.stringify(row) });
  if (!res.ok) throw new Error(res.status + ": " + await res.text());
}
function dbFetchComments() { return apiGetList(COMMENTS_API + "?room_id=eq." + encodeURIComponent(ROOM_ID) + "&order=created_at.asc"); }
async function dbFetchChat() {
  const d = await apiGetList(CHAT_API + "?room_id=eq." + encodeURIComponent(ROOM_ID) + "&order=created_at.desc&limit=200");
  return d.reverse();
}

function lsGet(k, def) { try { const v = localStorage.getItem(k); return v == null ? def : v; } catch { return def; } }
function lsSet(k, v)   { try { localStorage.setItem(k, v); } catch {} }
function tsOf(iso) { const t = Date.parse(iso); return isNaN(t) ? 0 : t; }
function maxIso(list) { let m = ""; list.forEach(x => { if (tsOf(x.created_at) > tsOf(m)) m = x.created_at; }); return m; }
function fmtDT(iso) {
  const d = new Date(iso); if (isNaN(d)) return "";
  return (d.getMonth() + 1) + "/" + d.getDate() + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}

function CommentSection({ entry, comments, currentUser, onAdd, onDelete, autoOpen }) {
  const list = comments.filter(c => c.entry_id === entry.id);
  const [open, setOpen] = useState(!!autoOpen);
  const [text, setText] = useState("");
  const [sending, setSending] = useState(false);
  const [confirmDel, setConfirmDel] = useState(null);
  useEffect(() => { if (autoOpen) setOpen(true); }, [autoOpen]);
  const send = async () => {
    const t = text.trim(); if (!t || sending) return;
    setSending(true);
    const ok = await onAdd(entry, t);
    if (ok) setText("");
    setSending(false);
  };
  return (
    <div style={{ marginTop: 8 }}>
      <button onClick={() => setOpen(o => !o)}
        style={{ background: "#1a1a22", border: "1px solid #2e2e36", borderRadius: 20, padding: "5px 12px", color: list.length ? "#4AB8D4" : "#8888a0", fontSize: 12, fontWeight: 600, cursor: "pointer" }}>
        💭 コメント{list.length > 0 ? " (" + list.length + ")" : ""} {open ? "▲" : "▼"}
      </button>
      {open && (
        <div style={{ marginTop: 8 }}>
